<meta name="description" content="Quizerion is a head-to-head quiz game. Every question is a clash and the faster correct answer lands the hit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0B1F4B; --muted:#51618A; --line:#CBD8F4; --hover:#EEF3FF; --gold:#B7791F;
  --you:#1D4ED8; --opp:#E4572E; --good:#13804F; --bad:#C0392B;
  --r:2px; --navy:#0B1F4B; --blue:#1D4ED8;
  --display:"Anton", Impact, "Arial Narrow", sans-serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html{background:#fff}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh;background:linear-gradient(180deg,#0B2A6F 0%,#1D4ED8 24%,#86A9FF 60%,#FFFFFF 100%)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--you);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;max-width:980px;margin:0 auto;padding:18px 20px}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.5rem;letter-spacing:.01em;background:none;border:0;padding:0}
.logo{height:32px;width:auto;display:block}
.logo.big{height:88px;margin-bottom:16px}
.chip{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 14px;font-weight:600}
.chip small{color:var(--muted);font-weight:500}
main{max-width:980px;margin:0 auto;padding:0 20px 64px}

h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.01em;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:400;line-height:1.1}
.sub{color:var(--muted);margin:8px 0 22px;max-width:56ch}

.panel{background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.lobby{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
@media (max-width:760px){.lobby{grid-template-columns:1fr}}

.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:20px}
.bot{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px}
.bot:hover{background:var(--hover)}
.bot[aria-pressed="true"]{border-color:var(--opp);background:color-mix(in srgb,var(--opp) 8%,var(--surface))}
.bot b{display:block;font-family:var(--display);font-size:1.1rem}
.bot .bt span{display:block;color:var(--muted);font-size:.88rem;line-height:1.3}
.bot .r{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem;color:#fff}
.avatar.opp{background:var(--opp)} .avatar.you{background:var(--you)}
.avatar{color:#150E26}

.field{display:flex;align-items:center;gap:12px;margin-bottom:20px;font-weight:600}
select{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:9px 12px}
.primary{background:linear-gradient(180deg,#9566FF,#6D3BDB);color:#fff;border:0;border-radius:var(--r);padding:13px 26px;font-weight:600;font-size:1.05rem}
.primary:hover{opacity:.9}
.ghost{background:none;border:1.5px solid var(--line);border-radius:var(--r);padding:12px 22px;font-weight:600}
.ghost:hover{background:var(--hover)}

.rating{font-family:var(--display);font-size:3.4rem;line-height:1;letter-spacing:.01em}
.tally{display:flex;gap:18px;margin:12px 0 18px;color:var(--muted)}
.tally b{color:var(--ink);font-size:1.15rem}
.rules{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;color:var(--muted);font-size:.95rem}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:.95rem}
.win{color:var(--good);font-weight:600} .loss{color:var(--bad);font-weight:600} .draw{color:var(--muted);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.9rem;margin-top:14px}

/* duel */
.duel{display:grid;gap:12px}
.side{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.side .who{min-width:120px}
.side .who b{display:block;font-family:var(--display);font-size:1.1rem;line-height:1.2}
.side .who span{color:var(--muted);font-size:.9rem}
.hp{flex:1;height:16px;border-radius:var(--r);background:var(--line);overflow:hidden}
.hpfill{height:100%;width:100%;border-radius:var(--r);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.opp .hpfill{background:var(--opp)} .you .hpfill{background:var(--you)}
.hpn{width:44px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hit{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}60%{transform:translateX(5px)}100%{transform:none}}

.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-height:360px}
.qhead{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.92rem;margin-bottom:12px;flex-wrap:wrap}
.qhead .locked{color:var(--opp);font-weight:600}
.clockrow{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.clock{flex:1;height:8px;background:var(--line);border-radius:var(--r);overflow:hidden}
.clockbar{height:100%;width:100%;background:var(--ink);transition:width .1s linear}
.clockbar.low{background:var(--opp)}
.secs{width:34px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--body);font-size:clamp(1.05rem,2.2vw,1.3rem);font-weight:600;line-height:1.45;margin-bottom:22px;max-width:62ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px}
.opt:hover:not(:disabled){background:var(--hover);border-color:var(--ink)}
.opt kbd{flex:none;width:26px;height:26px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;font:600 .85rem var(--body);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;min-height:44px;flex-wrap:wrap}
.verdict p{margin:0;font-weight:600}

/* result */
.result{text-align:center;max-width:520px;margin:20px auto 0}
.result h1{font-size:clamp(2.4rem,7vw,3.8rem)}
.result .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem}
.stat span{color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* dashboard */
.dash{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start;padding-top:8px}
@media (max-width:760px){.dash{grid-template-columns:1fr}}
.menu{display:grid;gap:12px}
.mbtn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:20px 24px;border-radius:var(--r);border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 72%,transparent);transition:transform .15s,border-color .15s}
.mbtn:hover{border-color:var(--you);transform:translateY(-2px)}
.mbtn b{font-family:var(--display);font-size:1.35rem;letter-spacing:.01em}
.mbtn span{color:var(--muted)}
.mbtn.hero{padding:30px 26px;border:0;color:#fff;background:linear-gradient(135deg,#9566FF 0%,#5B2BC9 100%)}
.mbtn.hero b{font-size:2rem}
.mbtn.hero span{color:rgba(255,255,255,.82)}
.mbtn .vs{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--display);font-size:4rem;letter-spacing:.01em;opacity:.2}
.side-col{display:grid;gap:18px}
.who2{display:flex;align-items:center;gap:14px}
.who2 b{display:block;font-family:var(--display);font-size:1.2rem;line-height:1.2}
.who2 .rating{margin-left:auto;font-size:2.2rem}
.avatar.big{width:56px;height:56px;font-size:1.5rem}
.tier{display:inline-block;margin-top:3px;padding:2px 10px;border-radius:var(--r);background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-weight:600;font-size:.85rem}
.prog{height:8px;border-radius:var(--r);background:var(--line);overflow:hidden;margin:16px 0 6px}
.progfill{height:100%;border-radius:var(--r);background:linear-gradient(90deg,#9566FF,var(--gold))}
.h2{font-size:1.2rem;margin-bottom:10px}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:var(--r)}
.lb li.you{background:color-mix(in srgb,var(--you) 22%,transparent);font-weight:600}
.lb .rk{color:var(--muted);font-variant-numeric:tabular-nums}
.lb .rt{font-weight:600;font-variant-numeric:tabular-nums}
.lb.big li{padding:12px 14px}
.lb.big li:nth-child(-n+3) .rk{color:var(--gold);font-weight:800}
.back{display:block;margin:0 0 14px;text-decoration:none}
.boardp{max-width:560px;margin:8px auto 0}
.chk{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;color:var(--muted);font-size:.92rem;cursor:pointer}
.chk input{width:auto;margin:0}
/* quizzes */
.qcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0}
.qcardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qcard textarea{display:block;width:100%;resize:vertical;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;font:inherit;margin-bottom:8px}
.ans{display:flex;align-items:center;gap:10px;margin:6px 0}
.ans input[type=text]{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:9px 10px;font:inherit}
.ans input[type=radio]{width:20px;height:20px;accent-color:var(--you);flex:none}
/* streak */
.streak{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px}
.streak svg{width:30px;height:30px;flex:none;color:var(--muted)}
.streak.on svg{color:#FF9F43}
.streak.on{border-color:color-mix(in srgb,#FF9F43 45%,var(--line))}
.streak b{display:block;line-height:1.2}
.streak span{color:var(--muted);font-size:.85rem}
.week{display:flex;gap:8px;margin-top:10px}
.wd{flex:1;text-align:center;font-size:.78rem;color:var(--muted)}
.wd i{display:block;height:34px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:4px}
.wd.on i{background:linear-gradient(180deg,#FFB35C,#FF7A5C);border-color:transparent}
/* profile */
.profile-page{max-width:720px;margin:8px auto 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0 4px}
.tag{display:inline-block;padding:1px 9px;border-radius:var(--r);border:1px solid var(--line);color:var(--muted);font-size:.78rem;font-weight:600;margin-right:8px;white-space:nowrap}
.frow .sub2{display:block;color:var(--muted);font-size:.85rem}
.res{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
/* online bar */
.onbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 12px calc(5px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.onbar[hidden]{display:none}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
/* friends */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:min(92vw,480px);padding:12px 16px;background:var(--surface);border:1px solid var(--you);border-radius:var(--r);box-shadow:0 10px 34px rgba(0,0,0,.5)}
.toast[hidden]{display:none}
.toast p{margin:0;flex:1 1 200px;font-weight:600}
.primary.sm{padding:7px 16px;font-size:.92rem;border-radius:var(--r)}
.dot{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:8px;border-radius:var(--r);background:var(--opp);color:#150E26;font:700 .8rem var(--body);vertical-align:middle}
.dot[hidden]{display:none}
.mbtn[hidden]{display:none}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.frow .rt2{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.fhead{font-family:var(--display);font-size:1.1rem;margin:22px 0 4px}
/* party */
.lb.party li{grid-template-columns:34px 1fr auto auto}
.gain{color:var(--good);font-size:.9rem;text-align:right;min-width:62px;font-variant-numeric:tabular-nums}
.lb .host{color:var(--muted);font-size:.85rem;font-weight:400}
/* singleplayer */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.segbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:9px 16px;font-weight:600;min-width:54px}
.segbtn:hover{background:var(--hover)}
.segbtn[aria-pressed="true"]{border-color:var(--you);background:color-mix(in srgb,var(--you) 20%,var(--surface))}
.setlbl{display:block;font-weight:600}
.bigscore{font-family:var(--display);font-size:clamp(3.2rem,11vw,5.2rem);line-height:1;letter-spacing:.01em;margin:8px 0 2px}
.badge{display:inline-block;padding:3px 12px;border-radius:var(--r);background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-weight:600;font-size:.9rem}
/* online + practice */
.main-col{display:grid;gap:18px}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.prow{grid-template-columns:1fr}}
.mbtn.sm{padding:14px 16px;border-radius:var(--r)}
.mbtn.sm b{font-size:1.1rem}
.code{font-family:var(--display);font-size:2.6rem;letter-spacing:.25em;text-align:center;padding:14px 14px 14px 24px;border:1.5px dashed var(--line);border-radius:var(--r);margin:6px 0 14px}
.codeinput{flex:1;min-width:0;padding:11px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.opt.picked{border-color:var(--you)}
/* account */
.acct{display:flex;align-items:center;gap:10px}
.chip[hidden]{display:none}
.chip b{font-weight:600}
.ghost.sm{padding:6px 14px;font-size:.92rem;border-radius:var(--r)}
.auth{max-width:420px;margin:12px auto 0}
.auth h1{font-size:clamp(1.7rem,4vw,2.2rem)}
.tabs{display:flex;gap:6px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.fld{display:block;font-weight:600;margin-bottom:14px}
.fld input{display:block;width:100%;margin-top:6px;padding:11px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:400}
.err{color:var(--bad);min-height:1.4em;margin-bottom:10px;font-size:.95rem}
.note{color:var(--muted);font-size:.9rem}
.auth .primary,.auth .ghost{width:100%}
.or{margin:14px 0}
/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding:28px 0 40px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.6rem)}
.hero .sub{font-size:1.1rem;margin-bottom:26px}
.mini{display:grid;gap:10px;padding:16px;pointer-events:none}
.mini .side{padding:10px 12px}
.mini .qm{font-family:var(--body);font-size:1.2rem;padding:8px 4px}
.mini .opts{grid-template-columns:1fr 1fr}
.mini .opt{padding:10px;font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{border-top:2px solid var(--ink);padding-top:12px}
.step b{font-family:var(--display);font-size:1.15rem;display:block;margin:2px 0 4px}
.step span{color:var(--muted)}
.step i{font-style:normal;font-family:var(--display);color:var(--muted)}
.foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== light theme: blue at the top fading to white, rectangular boxes ===== */
.avatar{color:#fff}
.dot{border-radius:999px;color:#fff}
.primary{background:linear-gradient(180deg,#3B6EF5,#1D4ED8)}
.mbtn.hero{background:linear-gradient(135deg,#2F6BFF 0%,#1238A8 100%);box-shadow:0 10px 26px rgba(11,31,75,.28)}
.panel{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 10px 30px rgba(11,31,75,.14)}
.mbtn{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 6px 18px rgba(11,31,75,.10)}
.mbtn.hero{background:linear-gradient(135deg,#2F6BFF 0%,#1238A8 100%)}
.top .brand{color:#fff}
.top .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.top .chip small{color:#D6E4FF}
.top .ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.top .ghost:hover{background:rgba(255,255,255,.16)}
#onnote:not(:empty){background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:var(--r)}
.result{background:#fff;border:1px solid var(--line);padding:30px 22px;max-width:560px;border-radius:var(--r);box-shadow:0 10px 30px rgba(11,31,75,.14)}
.side,.q,.stat,.qcard{box-shadow:0 4px 14px rgba(11,31,75,.06)}
/* colour and movement transitions */
button,select,input,textarea,.mbtn,.opt,.bot,.segbtn,.tab,.chip{transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s,transform .15s}
main>*{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== opening page ===== */
body.landing{background:#fff}
body.landing main{max-width:none;padding:0}
body.landing .top{position:absolute;top:0;left:0;right:0;max-width:none;margin:0;padding:18px max(20px,calc((100vw - 1040px) / 2));z-index:6}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.lp-hero{position:relative;overflow:hidden;min-height:96vh;display:flex;align-items:center;background:linear-gradient(180deg,#0B1F4B 0%,#1D4ED8 40%,#B9D0FF 80%,#FFFFFF 100%)}
.lp-hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lp-heroin{position:relative;z-index:2;text-align:center;padding:120px 20px 130px;max-width:880px;margin:0 auto;pointer-events:none}
.lp-heroin>*{pointer-events:auto}
.lp-heroin .logo.big{margin:0 auto 18px;height:76px}
.lp-kicker{display:inline-block;padding:5px 14px;border:1px solid rgba(255,255,255,.55);color:#fff;font-weight:600;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 18px}
.lp-heroin h1{color:#fff;font-size:clamp(2.7rem,8.4vw,5.6rem);line-height:1.02;text-transform:uppercase;letter-spacing:.015em;text-shadow:0 4px 30px rgba(11,31,75,.45)}
.lp-lead{color:#E3EDFF;font-size:1.12rem;max-width:56ch;margin:18px auto 28px}
.lp-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.primary.lg{padding:15px 36px;font-size:1.1rem}
.ghost-w{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.75);padding:14px 28px;border-radius:var(--r);font-weight:600;font-size:1.05rem}
.ghost-w:hover{background:rgba(255,255,255,.16)}
.lp-pills{list-style:none;margin:38px 0 0;padding:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lp-pills li{background:#fff;color:var(--ink);border:1px solid var(--line);padding:7px 14px;font-weight:600;font-size:.88rem;box-shadow:0 4px 14px rgba(11,31,75,.12)}
.lp-sec{padding:76px 0;background:#fff}
.lp-sec.alt{background:#F2F6FF}
.lp-sec h2{font-size:clamp(1.9rem,4.4vw,3rem);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0 0 10px}
.lp-lede{color:var(--muted);max-width:60ch;margin:0 0 30px}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.lp-card{background:#fff;border:1px solid var(--line);padding:22px;box-shadow:0 6px 18px rgba(11,31,75,.08)}
.lp-card h3{font-family:var(--display);font-weight:400;font-size:1.4rem;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px}
.lp-card p{margin:0;color:var(--muted)}
.lp-card .num{display:block;font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--blue);margin-bottom:10px}
.lp-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.lp-tab{padding:9px 16px;border:1.5px solid var(--line);background:#fff;font-weight:600;border-radius:var(--r)}
.lp-tab[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.lp-row{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.lp-row:last-child{border-bottom:1px solid var(--line)}
.lp-len{font-family:var(--display);font-size:1.3rem;color:var(--blue)}
.lp-row b{display:block;font-size:1.05rem}
.lp-row span{color:var(--muted)}
.lp-remind{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.lp-remind input{padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r);font:inherit;background:#fff;color:var(--ink)}
.lp-bots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.lp-bot{background:#fff;border:1px solid var(--line);padding:14px;text-align:center;box-shadow:0 6px 18px rgba(11,31,75,.08)}
.lp-bot b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem;text-transform:uppercase;letter-spacing:.02em;margin-top:8px}
.lp-bot .r{color:var(--blue);font-weight:700}
.lp-bot span.d{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.ht{width:100%;aspect-ratio:1/1;background:radial-gradient(circle,hsl(var(--h) 78% 40%) 42%,transparent 46%) 0 0/9px 9px;-webkit-mask:radial-gradient(circle at 50% 34%,#000 21%,transparent 22.5%),radial-gradient(ellipse 48% 38% at 50% 100%,#000 98%,transparent 100%);mask:radial-gradient(circle at 50% 34%,#000 21%,transparent 22.5%),radial-gradient(ellipse 48% 38% at 50% 100%,#000 98%,transparent 100%)}
.lp-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lp-field{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);padding:16px 18px}
.lp-field b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em}
.lp-field span{color:var(--muted);font-size:.9rem}
.faq{border-top:1px solid var(--line);padding:2px 0}
.faq:last-of-type{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:700;padding:16px 4px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--display);font-size:1.4rem;color:var(--blue);line-height:1}
.faq[open] summary::after{content:"−"}
.faq p{margin:0 4px 18px;color:var(--muted);max-width:68ch}
.lp-band{background:linear-gradient(135deg,#0B1F4B,#1D4ED8);color:#fff;padding:72px 20px;text-align:center}
.lp-band h2{color:#fff;font-size:clamp(1.8rem,4.4vw,3rem);text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
.lp-band p{color:#DCE8FF;max-width:52ch;margin:0 auto 18px}
.lp-cd{font-family:var(--display);font-size:clamp(2.6rem,9vw,5rem);letter-spacing:.06em;line-height:1;margin:10px 0 24px;font-variant-numeric:tabular-nums}
.lp-foot{padding:28px 20px;text-align:center;color:var(--muted);font-size:.9rem;background:#fff}
@media (max-width:620px){.lp-row{grid-template-columns:1fr;gap:4px}}

/* ============================================================

const QUESTIONS = [
  {q:"A scientist working in Calcutta studied how light changes when it passes through transparent materials. His work grew partly from questions about the colour of the sea and later transformed spectroscopy. Identify the physicist whose name is attached to the effect.", options:["C. V. Raman", "J. C. Bose", "Meghnad Saha", "Subrahmanyan Chandrasekhar"], answer:0, category:"Science & Tech"},
  {q:"A medieval Karnataka town is known for a temple whose sculptures are celebrated by architectural historians. An older form of the town’s name became linked to a blue-green mineral, which later lent its name to an element with atomic number four. Identify the element.", options:["Boron", "Beryllium", "Lithium", "Magnesium"], answer:1, category:"Science & Tech"},
  {q:"A political term combines Greek roots associated with a small group and with rule or power. Today it describes a system in which authority is concentrated among a relatively small, privileged section of society. Identify the term.", options:["Plutocracy", "Aristocracy", "Oligarchy", "Technocracy"], answer:2, category:"History & World"},
  {q:"A reformer from Bengal drew on Indian philosophy and contemporary debate to challenge sati and support women’s education. He founded an organisation promoting monotheism that later became central to a broader reform movement. Identify him.", options:["Dayananda Saraswati", "Ishwar Chandra Vidyasagar", "Swami Vivekananda", "Raja Ram Mohan Roy"], answer:3, category:"India"},
  {q:"A physicist studying radiation from heated objects found that classical theories failed at shorter wavelengths. His proposal that energy is exchanged in discrete packets became a foundation of quantum theory. Identify the scientist.", options:["Max Planck", "Heinrich Hertz", "Wilhelm Wien", "Gustav Kirchhoff"], answer:0, category:"Science & Tech"},
  {q:"An ancient Indian learning centre attracted students from across Asia and taught logic, medicine, grammar and astronomy alongside Buddhist philosophy. The Chinese traveller Xuanzang recorded details of its academic life. Identify the institution in Bihar.", options:["Taxila", "Nalanda", "Vikramashila", "Valabhi"], answer:1, category:"India"},
  {q:"A Dutch artist painted a night landscape while staying in southern France. Its swirling sky, bright stars, cypress tree and quiet village became famous long after the artist’s death. Identify the painting.", options:["The Potato Eaters", "Sunflowers", "The Starry Night", "Irises"], answer:2, category:"Arts & Literature"},
  {q:"A programming language took its name from a British television comedy series rather than a technical acronym. Released publicly in 1991, it became known for readable syntax and is now widely used in data science and AI. Identify it.", options:["Java", "Ruby", "Rust", "Python"], answer:3, category:"Science & Tech"},
  {q:"A self-taught mathematician from Tamil Nadu sent notebooks of unusual formulas to a Cambridge scholar, who recognised their originality. Their collaboration contributed to number theory, infinite series and partition theory. Identify the mathematician.", options:["Srinivasa Ramanujan", "Harish-Chandra", "P. C. Mahalanobis", "D. R. Kaprekar"], answer:0, category:"Science & Tech"},
  {q:"A Prague-born German-language writer portrayed ordinary people trapped in strange, impersonal systems. His surname became an adjective for absurd, oppressive and confusing bureaucratic situations. Identify the writer.", options:["Thomas Mann", "Franz Kafka", "Hermann Hesse", "Stefan Zweig"], answer:1, category:"Arts & Literature"},
  {q:"A post-First World War settlement redrew borders, restricted Germany’s military and created an international organisation intended to preserve peace. Its terms remained controversial and later became part of debates about European instability. Identify the treaty.", options:["Treaty of Westphalia", "Treaty of Tordesillas", "Treaty of Versailles", "Treaty of Brest-Litovsk"], answer:2, category:"History & World"},
  {q:"Founded through the initiative of Jamsetji Tata, this Bengaluru institution was designed to strengthen advanced scientific research in India. It later became a major centre for work in physics, chemistry and biology. Identify it.", options:["Indian Statistical Institute", "Raman Research Institute", "Tata Institute of Fundamental Research", "Indian Institute of Science"], answer:3, category:"India"},
  {q:"A continent’s name developed from a Roman term that originally referred to a smaller region near the southern Mediterranean. It contains many climatic zones and the world’s largest hot desert. Identify the continent.", options:["Africa", "Asia", "Australia", "South America"], answer:0, category:"History & World"},
  {q:"A physicist trained in Europe helped establish India’s nuclear research infrastructure after independence. A major research centre in Mumbai was later named after him. Identify the scientist.", options:["Vikram Sarabhai", "Homi J. Bhabha", "Raja Ramanna", "A. P. J. Abdul Kalam"], answer:1, category:"India"},
  {q:"A classical dance tradition connected with Tamil temple culture was reshaped for the modern stage during the twentieth century. Its language combines rhythmic footwork, codified gestures and expressive storytelling. Identify the dance form.", options:["Kathak", "Odissi", "Bharatanatyam", "Kuchipudi"], answer:2, category:"India"},
  {q:"Astronomers noticed that Uranus did not follow its predicted path exactly. Mathematical predictions suggested an unseen planet, which an observatory in Berlin then located close to the calculated position. Identify the planet.", options:["Pluto", "Vulcan", "Ceres", "Neptune"], answer:3, category:"Science & Tech"},
  {q:"A novella begins with its protagonist undergoing a bizarre physical transformation, yet the narrative focuses on family, work and alienation rather than explaining the event. Its German title refers broadly to transformation. Identify the work.", options:["The Metamorphosis", "The Trial", "The Castle", "The Stranger"], answer:0, category:"Arts & Literature"},
  {q:"An agricultural scientist helped adapt high-yielding crop varieties and modern farming practices during a period of serious food insecurity in India. His work became closely associated with a dramatic increase in wheat production. Identify him.", options:["Verghese Kurien", "M. S. Swaminathan", "Vikram Sarabhai", "Salim Ali"], answer:1, category:"India"},
  {q:"An Indian filmmaker developed a science-fiction story about a mysterious visitor arriving in rural Bengal, but an international production collapsed. A later Hollywood film about a stranded extraterrestrial became a major success. Identify that film’s director.", options:["James Cameron", "George Lucas", "Steven Spielberg", "Ridley Scott"], answer:2, category:"Film & Music"},
  {q:"A Greek mathematician’s name is attached to a theorem about the sides of a right-angled triangle. Although similar relationships were known earlier elsewhere, the theorem became central to geometry education. Identify him.", options:["Euclid", "Archimedes", "Thales", "Pythagoras"], answer:3, category:"Science & Tech"},
  {q:"A physician from ancient Greece is traditionally associated with a famous oath and is often described as a foundational figure in Western medicine. Historians distinguish the historical person from texts later gathered under his name. Identify him.", options:["Hippocrates", "Galen", "Aristotle", "Avicenna"], answer:0, category:"Science & Tech"},

   ONLINE ACCOUNTS (optional)
   Leave FIREBASE_CONFIG as null and accounts stay inside each browser.

const FIREBASE_CONFIG = null;

/* ---------------- Storage & accounts ---------------- */
// All data lives in this browser (localStorage). Every storage call goes through
// lsGet / lsSet / lsDel, so a hosted backend can replace them later.
const ACC_KEY = "quizevo.accounts", SES_KEY = "quizevo.session", PROG = "quizevo.progress.";
const defaults = () => ({rating:800, wins:0, losses:0, draws:0, history:[], solo:{}, games:[], streak:{count:0, best:0, last:""}, days:[]});
const mem = {};
function lsGet(k){ try{ const v = localStorage.getItem(k); if(v !== null) return v; }catch(e){} return k in mem ? mem[k] : null; }
function lsSet(k,v){ mem[k] = v; try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }

let session = null;          // null, {guest:true}, or {name, key}
let save = defaults();
function getAccounts(){ try{ return JSON.parse(lsGet(ACC_KEY) || "{}"); }catch(e){ return {}; } }
function loadProgress(key){
  try{ const r = lsGet(PROG + key); if(r) return Object.assign(defaults(), JSON.parse(r)); }catch(e){}
  return defaults();
}
// The last 30 games of every kind, shown on the profile page.
function logGame(g){ save.games = [Object.assign({t:Date.now()}, g)].concat(save.games || []).slice(0, 30); touchStreak(); }

// Daily streak: a day counts when you finish at least one game of any kind.
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
function touchStreak(now){
  const t = dayKey(now || Date.now());
  const st = Object.assign({count:0, best:0, last:""}, save.streak || {});
  const days = (save.days || []).slice();
  if(!days.includes(t)) days.push(t);
  save.days = days.sort().slice(-60);
  if(st.last === t){ save.streak = st; return; }
  const gap = st.last ? daysBetween(st.last, t) : null;
  if(gap === 1) st.count += 1;
  else if(gap === null || gap > 1) st.count = 1;      // first game ever, or a day was missed
  st.best = Math.max(st.best, st.count); st.last = t; save.streak = st;
  if(st.count >= 2) showToast(`${st.count}-day streak. Come back tomorrow to keep it going.`, [], 6000);
}
function streakInfo(now){
  const st = save.streak || {count:0, best:0, last:""}, today = dayKey(now || Date.now());
  let count = 0, playedToday = false;
  if(st.last === today){ count = st.count; playedToday = true; }
  else if(st.last && daysBetween(st.last, today) === 1) count = st.count;
  return {count, best:Math.max(st.best || 0, count), playedToday};
}
const FLAME = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c.6 3.2-1.4 4.9-3 6.9C7.4 10.7 6 12.6 6 15.2 6 18.6 8.7 22 12 22s6-3.4 6-6.8c0-2.2-1-3.8-2.2-5.2-.4 1.1-1.1 1.9-2 2.3.5-3.6-.8-7.7-1.8-10.3z"/></svg>`;
function streakBadge(){
  const s = streakInfo();
  const sub = s.playedToday ? "You've played today. See you tomorrow." : s.count > 0 ? "Play a game today to keep it going." : "Play a game today to start one.";
  return `<div class="streak ${s.count ? "on" : ""}">${FLAME}<div><b>${s.count ? `${s.count}-day streak` : "No streak yet"}</b><span>${sub}</span></div></div>`;
}
function weekCells(){
  const days = new Set(save.days || []), names = ["S","M","T","W","T","F","S"], out = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d.getTime());
    out.push(`<div class="wd ${days.has(k) ? "on" : ""}" title="${k}"><i></i>${i === 0 ? "Today" : names[d.getDay()]}</div>`);
  }
  return out.join("");
}
function persist(){
  if(session && session.key) lsSet(PROG + session.key, JSON.stringify(save));
  else if(session && session.uid) cloudSave();
}

const enc = new TextEncoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function hashPw(pw, salt){
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:100000, hash:"SHA-256"}, key, 256));
}
const USER_RE = /^[A-Za-z0-9_]{3,20}$/;
function needCrypto(){ if(!(window.crypto && crypto.subtle)) throw new Error("Accounts need a secure (https) connection."); }

async function signUp(name, pw){
  if(!USER_RE.test(name)) throw new Error("Use 3–20 letters, numbers or underscores for your username.");
  if(pw.length < 6) throw new Error("Use at least 6 characters for your password.");
  needCrypto();
  const key = name.toLowerCase(), accs = getAccounts();
  if(accs[key]) throw new Error("That username is taken. Try another, or log in.");
  const salt = crypto.getRandomValues(new Uint8Array(16));
  accs[key] = {name, salt:b64(salt), hash:await hashPw(pw, salt)};
  lsSet(ACC_KEY, JSON.stringify(accs));
  const carry = session && session.guest && (save.wins + save.losses + save.draws > 0);
  save = carry ? save : defaults();
  session = {name, key};
  lsSet(SES_KEY, key);
  persist();
}
async function logIn(name, pw){
  needCrypto();
  const key = name.toLowerCase(), a = getAccounts()[key];
  if(!a || (await hashPw(pw, unb64(a.salt))) !== a.hash) throw new Error("Wrong username or password.");
  session = {name:a.name, key};
  lsSet(SES_KEY, key);
  save = loadProgress(key);
}

/* ---------------- Online accounts (Firebase) ---------------- */
let CLOUD = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey);
let fb = null, cloudFailed = false, cloudMsg = "";
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src));
    document.head.appendChild(s);
  });
}
const FB_SOURCES = [
  v => `https://www.gstatic.com/firebasejs/10.12.2/firebase-${v}-compat.js`,
  v => `https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/firebase-${v}-compat.min.js`
];
async function initCloud(){
  let failure = null;
  for(const src of FB_SOURCES){          // try each host until one loads all three files
    try{
      for(const part of ["app", "auth", "firestore"]) await loadScript(src(part));
      failure = null; break;
    }catch(e){ failure = e; }
  }
  if(failure) throw failure;
  firebase.initializeApp(FIREBASE_CONFIG);
  fb = {auth: firebase.auth(), fs: firebase.firestore()};
}
async function cloudLoad(uid){
  const d = await fb.fs.collection("players").doc(uid).get();
  if(!d.exists) return null;
  const x = d.data();
  return {name:x.name, save:Object.assign(defaults(), {rating:x.rating, wins:x.wins, losses:x.losses, draws:x.draws, history:x.history || [], solo:x.solo || {}, games:x.games || [], streak:x.streak || {count:0, best:0, last:""}, days:x.days || []})};
}
function cloudSave(){
  if(!(fb && session && session.uid)) return Promise.resolve();
  return fb.fs.collection("players").doc(session.uid).set({
    name:session.name, nameLower:(session.name || "").toLowerCase(), rating:save.rating, wins:save.wins, losses:save.losses, draws:save.draws,
    history:save.history, solo:save.solo || {}, games:save.games || [], streak:save.streak || {count:0, best:0, last:""}, days:save.days || [], updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).catch(e => console.error("Save failed", e));
}
function cloudErr(e){
  const c = e && e.code || "";
  if(c === "auth/email-already-in-use") return "That email already has an account. Log in instead.";
  if(c === "auth/invalid-email") return "That email address doesn’t look right.";
  if(c === "auth/weak-password") return "Use at least 6 characters for your password.";
  if(/wrong-password|user-not-found|invalid-credential|invalid-login/.test(c)) return "Wrong email or password.";
  if(c === "auth/too-many-requests") return "Too many attempts. Wait a moment and try again.";
  if(c === "auth/network-request-failed") return "Can’t reach the server. Check your connection.";
  return (e && e.message) || "Something went wrong. Try again.";
}
async function signUpCloud(email, pw, display){
  if(!USER_RE.test(display)) throw new Error("Use 3–20 letters, numbers or underscores for your display name.");
  let cred;
  try{ cred = await fb.auth.createUserWithEmailAndPassword(email, pw); }catch(e){ throw new Error(cloudErr(e)); }
  const carry = session && session.guest && (save.wins + save.losses + save.draws > 0);
  save = carry ? save : defaults();
  session = {name:display, uid:cred.user.uid};
  await cloudSave();
}
async function logInCloud(email, pw){
  let cred;
  try{ cred = await fb.auth.signInWithEmailAndPassword(email, pw); }catch(e){ throw new Error(cloudErr(e)); }
  const rec = await cloudLoad(cred.user.uid);
  session = {name: rec ? rec.name : (email.split("@")[0] || "Player"), uid:cred.user.uid};
  save = rec ? rec.save : defaults();
}

/* ---------------- Helpers ---------------- */
const $ = id => document.getElementById(id);
const app = $("app");
const LOGO_SRC = ((document.querySelector ? document.querySelector(".brand .logo") : null) || {}).src || "";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function updateChip(){
  if(document.body) document.body.classList.remove("landing");
  const chip = $("ratingChip"), btn = $("authbtn");
  if(!session){ chip.hidden = true; btn.textContent = "Log in"; btn.onclick = () => showAuth("login"); return; }
  chip.hidden = false;
  chip.onclick = () => { if(leaveOk()) showProfile(); };
  chip.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); chip.onclick(); } };
  chip.tabIndex = 0; chip.style.cursor = "pointer"; chip.setAttribute("role", "button"); chip.setAttribute("aria-label", "Open your profile");
  chip.innerHTML = `<b>${session.guest ? "Guest" : esc(session.name)}</b> <small>Rating</small> ${save.rating}`;
  btn.textContent = session.guest ? "Log in" : "Log out";
  btn.onclick = session.guest ? () => showAuth("login") : doLogout;
}
function leaveOk(){
  if(O && !O.finished){
    if(!confirm("Leave this duel? You'll forfeit it and lose rating.")) return false;
    forfeitOnline();
    return true;
  }
  if(PT && !PT.finished){ if(!confirm(PT.isHost ? "End the party for everyone?" : "Leave the party?")) return false; partyLeave(); return true; }
  if(Q || MM || DU) return true;
  if(S && !S.finished) return confirm("Leave this run? Your score won't be saved.");
  if(!D) return true;
  // Quitting a bot duel counts as a loss, so rating can't be farmed by leaving lost games.
  if(!confirm("Leave this duel? It counts as a loss.")) return false;
  clearTimers();
  applyResult("loss", D.bot.name, D.bot.rating, "bot");
  D = null;
  return true;
}
// Closing or reloading the tab mid-duel must not be a free escape from a loss.
addEventListener("pagehide", ev => {
  if(ev.persisted) return;   // page is only being cached for back/forward, not closed
  try{
    if(O && !O.finished) forfeitOnline();
    else if(D && D.bot && !PT && !Q && !MM){ clearTimers(); applyResult("loss", D.bot.name, D.bot.rating, "bot"); D = null; }
  }catch(e){}
});
function doLogout(){
  if(!leaveOk()) return;
  clearTimers(); D = null;
  stopFriendWatch(); stopPresence();
  if(fb && session && session.uid) fb.auth.signOut();
  lsDel(SES_KEY); session = null; save = defaults();
  showHome();
}

let D = null;                       // current duel
let selBot = "regular", selCat = "all";

function clearTimers(){
  if(D){ clearInterval(D.timer); clearTimeout(D.auto); }
  if(O){ if(O.unsub) O.unsub(); clearInterval(O.timer); clearTimeout(O.auto); clearTimeout(O.fto); O = null; }
  if(Q) cancelWaiting();
  if(S){ clearInterval(S.timer); clearTimeout(S.auto); S = null; }
  if(PT){ [PT.unsub, PT.unsubP, PT.unsubA].forEach(f => { if(f) f(); }); clearInterval(PT.timer); clearTimeout(PT.hostT); clearTimeout(PT.fillT); clearTimeout(PT.autoT); PT = null; }
  if(MM) cancelSearch();
  if(DU) closeDuo();
}

/* ---------------- Auth ---------------- */
// What the person typed survives switching between "Log in" and "Create account".
let authDraft = {u:"", p:"", dn:""};
function saveDraft(){
  ["u","p","dn"].forEach(k => { const el = $(k); if(el && typeof el.value === "string") authDraft[k] = el.value; });
}
function showAuth(mode){
  if(!leaveOk()) return;
  clearTimers(); D = null; updateChip();
  const su = mode === "signup";
  const d = authDraft;
  const carry = su && session && session.guest && (save.wins + save.losses + save.draws > 0);
  const guess = (d.u.split("@")[0] || "").replace(/[^A-Za-z0-9_]/g, "").slice(0, 20);
  const dn = d.dn || (guess.length >= 3 ? guess : "");
  const idField = CLOUD
    ? `<label class="fld">Email<input id="u" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" value="${esc(d.u)}" required></label>`
    : `<label class="fld">Username<input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" value="${esc(d.u)}" required></label>`;
  app.innerHTML = `
  <section class="panel auth">
    <h1>${su ? "Create your account" : "Log in"}</h1>
    <p class="sub">Save your rating and duel history.</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-login" aria-selected="${!su}">Log in</button>
      <button class="tab" role="tab" id="t-signup" aria-selected="${su}">Create account</button>
    </div>
    <form id="authform" novalidate>
      ${idField}
      ${su && CLOUD ? `<label class="fld">Display name<input id="dn" autocomplete="nickname" maxlength="20" value="${esc(dn)}" required></label>` : ""}
      <label class="fld">Password<input id="p" type="password" autocomplete="${su ? "new-password" : "current-password"}" value="${esc(d.p)}" required></label>
      <label class="chk"><input type="checkbox" id="showpw"> Show password</label>
      ${!su && CLOUD ? `<button type="button" class="linkbtn" id="forgot" style="margin:0 0 10px">Forgot password?</button>` : ""}
      <div class="err" id="autherr" role="alert"></div>
      <button class="primary" type="submit" id="submit">${su ? "Create account" : "Log in"}</button>
    </form>
    ${carry ? `<p class="note">Your guest rating and results will carry over to the new account.</p>` : ""}
    <div class="or"><button class="ghost" id="guest">Play as guest</button></div>
    <p class="note">${CLOUD ? "Your account works on any browser or device." : cloudFailed ? "Online accounts are unavailable right now, so accounts are stored in this browser only." : "Accounts are stored in this browser. Progress doesn’t follow you to other devices yet."}</p>
  </section>`;
  $("t-login").onclick = () => { saveDraft(); showAuth("login"); };
  $("t-signup").onclick = () => { saveDraft(); showAuth("signup"); };
  $("showpw").onchange = e => { $("p").type = e.target.checked ? "text" : "password"; };
  if($("forgot")) $("forgot").onclick = async () => {
    const err = $("autherr"), email = $("u").value.trim();
    if(!email){ err.textContent = "Type your email above first."; return; }
    try{ await fb.auth.sendPasswordResetEmail(email); err.textContent = "If that email has an account, a reset link is on its way."; }
    catch(ex){ err.textContent = cloudErr(ex); }
  };
  $("guest").onclick = () => { if(!session){ session = {guest:true}; save = defaults(); } showDash(); };
  $("authform").onsubmit = async e => {
    e.preventDefault();
    const err = $("autherr"), btn = $("submit");
    err.textContent = "";
    const name = $("u").value.trim(), pw = $("p").value;
    btn.disabled = true;
    try{
      if(CLOUD){ if(su) await signUpCloud(name, pw, $("dn").value.trim()); else await logInCloud(name, pw); }
      else { if(su) await signUp(name, pw); else await logIn(name, pw); }
      authDraft = {u:"", p:"", dn:""};
      showDash();
    }catch(ex){
      btn.disabled = false; saveDraft();
      const msg = esc(ex.message), link = t => ` <button type="button" class="linkbtn" id="alt" style="margin:0">${t}</button>`;
      if(!su && /^Wrong/.test(ex.message)) err.innerHTML = msg + link("New here? Create an account with these details");
      else if(su && /already has an account|taken/.test(ex.message)) err.innerHTML = msg + link("Log in with these details");
      else err.textContent = ex.message;
      if($("alt")) $("alt").onclick = () => showAuth(su ? "login" : "signup");
    }
  };
  $("u").focus();
}

/* ---------------- Dashboard ---------------- */
const TIERS = [[0,"Novice"],[600,"Apprentice"],[1000,"Adept"],[1400,"Expert"],[1800,"Grandmaster"]];
function tierOf(r){
  let i = 0;
  TIERS.forEach((t,k) => { if(r >= t[0]) i = k; });
  const nx = TIERS[i+1];
  return {name:TIERS[i][1], next:nx ? nx[1] : null, need:nx ? nx[0] - r : 0, pct:nx ? Math.round((r - TIERS[i][0]) / (nx[0] - TIERS[i][0]) * 100) : 100};
}

async function getBoard(){
  const me = {name: session.guest ? "You (guest)" : session.name, rating:save.rating, you:true};
  if(CLOUD && fb){
    try{
      let raw;

      else{
        const snap = await fb.fs.collection("players").orderBy("rating","desc").limit(25).get();
        raw = snap.docs.map(d => ({id:d.id, name:d.data().name || "Player", rating:d.data().rating || 0}));
        boardCache = {t:Date.now(), uid:session.uid, raw};
      }
      const rows = raw.map(r => { const you = !!session.uid && r.id === session.uid; return {name:r.name, rating:you ? save.rating : r.rating, you}; });
      if(!rows.some(r => r.you)) rows.push(me);
      rows.sort((a,b) => b.rating - a.rating);
      return {rows, kind:"players"};
    }catch(e){ console.error(e); return {rows:[me], kind:"error"}; }
  }
  // Offline: the accounts created on this device
  const accs = getAccounts();
  const rows = Object.keys(accs).map(k => {
    const mine = !!session.key && session.key === k;
    return {name:accs[k].name, rating: mine ? save.rating : loadProgress(k).rating, you:mine};
  });
  if(session.guest) rows.push(me);
  rows.sort((a,b) => b.rating - a.rating);
  return {rows, kind:"local"};
}

function startArrows(){
  const cv = $("arrows"); if(!cv || !cv.getContext) return;
  const g = cv.getContext("2d"); if(!g) return;
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  let W = 0, H = 0, pts = [], ptr = {x:0, y:0, on:false}, ripples = [];
  const lerpAng = (a, b, t) => { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * t; };
  function layout(){
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gap = W < 600 ? 30 : 38; pts = [];
    for(let y = gap / 2; y < H; y += gap) for(let x = gap / 2; x < W; x += gap) pts.push({x, y, a:Math.PI / 2, s:1});
  }
  function draw(now){
    g.clearRect(0, 0, W, H);
    ripples = ripples.filter(r => now - r.t < 1300);
    pts.forEach(p => {
      let target = ptr.on ? Math.atan2(ptr.y - p.y, ptr.x - p.x) : Math.PI / 2, scale = 1;
      ripples.forEach(r => {
        const age = now - r.t, dist = Math.hypot(p.x - r.x, p.y - r.y), ring = age * 0.55;
        const w = Math.exp(-Math.pow((dist - ring) / 46, 2)) * (1 - age / 1300);
        if(w > 0.02){ target = lerpAng(target, Math.atan2(p.y - r.y, p.x - r.x), Math.min(1, w * 2.2)); scale += w * 1.3; }
      });
      p.a = reduce ? target : lerpAng(p.a, target, 0.14); p.s += (scale - p.s) * 0.25;
      const t = Math.min(1, p.y / H);
      const c = Math.round(255 - t * 224), c2 = Math.round(255 - t * 200);   // white on navy, navy on white
      g.fillStyle = `rgba(${c}, ${c2}, ${Math.round(255 - t * 180)}, ${0.78 - t * 0.38})`;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.scale(p.s, p.s);
      g.beginPath(); g.moveTo(6, 0); g.lineTo(-4.5, -4); g.lineTo(-2, 0); g.lineTo(-4.5, 4); g.closePath(); g.fill();
      g.restore();
    });
  }
  layout();
  if(reduce){ draw(performance.now()); return; }
  const hero = cv.parentElement;
  const rel = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
  hero.addEventListener("pointermove", e => { Object.assign(ptr, rel(e)); ptr.on = true; });
  hero.addEventListener("pointerleave", () => { ptr.on = false; });
  hero.addEventListener("pointerdown", e => { const q = rel(e); ripples.push({x:q.x, y:q.y, t:performance.now()}); Object.assign(ptr, q); ptr.on = true; });
  window.addEventListener("resize", layout);
  const loop = now => {
    if(cv.isConnected === false || !$("arrows")){ window.removeEventListener("resize", layout); return; }
    draw(now); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function startCountdown(){
  const tick = () => {
    const e = $("lp-cd"); if(!e || e.isConnected === false) return false;
    const now = new Date(), end = new Date(now); end.setHours(24, 0, 0, 0);
    const s = Math.max(0, Math.floor((end - now) / 1000));
    e.textContent = [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(n => String(n).padStart(2, "0")).join(":");
    return true;
  };
  if(!tick()) return;
  const id = setInterval(() => { if(!tick()) clearInterval(id); }, 1000);
}
function downloadReminder(time){
  const [hh, mm] = (time || "18:00").split(":"), pad = n => String(n).padStart(2, "0"), d = new Date();
  const start = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${hh}${mm}00`;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");

    `DTSTART:${start}`, "DURATION:PT15M", "RRULE:FREQ=DAILY", "SUMMARY:Play Quizerion", `DESCRIPTION:Play a game to keep your daily streak going.${url ? " " + url : ""}`,
    "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", "DESCRIPTION:Play Quizerion", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"})); a.download = "quizerion-daily-reminder.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

      <div class="rating">${save.rating}</div>
      <div class="tally">
        <span><b>${save.wins}</b> won</span><span><b>${save.losses}</b> lost</span><span><b>${save.draws}</b> drawn</span>
      </div>
      <ul class="hist">${recent}</ul>
      ${session.guest ? `<p class="note">Playing as a guest, so your rating won’t be kept. <button class="linkbtn" id="gologin" style="margin-top:0">Create an account</button> to save it.</p>` : ""}
      <div class="rules">Answer with the mouse or keys 1–4.</div>
      <button class="linkbtn" id="reset">Reset record</button>
    </aside>
  </section>`;

  app.querySelectorAll(".bot").forEach(btn => btn.onclick = () => {
    selBot = btn.dataset.bot;
    app.querySelectorAll(".bot").forEach(b => b.setAttribute("aria-pressed", b.dataset.bot===selBot));
  });
  $("cat").onchange = e => selCat = e.target.value;
  fillFieldSelect($("cat"), () => selCat, "All topics");
  $("go").onclick = () => startDuel(selBot, selCat);
  $("bk").onclick = showDash;
  $("reset").onclick = () => { if(confirm("Reset your rating and history?")){ save = defaults(); persist(); showLobby(); } };

}

/* ---------------- Duel ---------------- */
function startDuel(botId, cat){
  const bot = BOTS.find(b => b.id === botId);
  let pool = fieldPool(cat);
  pool = shuffle(pool).slice(0, ROUNDS);
  D = {bot, cat, pool, i:0, hp:{you:START_HP, opp:START_HP}, correct:0, answered:0, locked:true, timer:null, auto:null};

  app.innerHTML = `
  <section class="duel">
    <div class="side opp" id="side-opp">
      <span class="avatar" style="background:hsl(${bot.hue} 52% 38%);color:#fff">${bot.name[0]}</span>
      <div class="who"><b>${bot.name}</b><span>${bot.rating}</span></div>
      <div class="hp"><div class="hpfill" id="hp-opp"></div></div><span class="hpn" id="hpn-opp">${START_HP}</span>
    </div>
    <div class="q">
      <div class="qhead"><span id="round"></span><span id="botstate"></span><span id="qcat"></span></div>
      <div class="clockrow"><div class="clock"><div class="clockbar" id="bar"></div></div><span class="secs" id="secs"></span></div>
      <h2 class="qtext" id="qtext"></h2>
      <div class="opts" id="opts"></div>
      <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
    </div>
    <div class="side you" id="side-you">
      <span class="avatar you">Y</span>
      <div class="who"><b>You</b><span>${save.rating}</span></div>
      <div class="hp"><div class="hpfill" id="hp-you"></div></div><span class="hpn" id="hpn-you">${START_HP}</span>
    </div>
  </section>`;
  nextQuestion();
}

function setHP(){
  ["you","opp"].forEach(w => { $("hp-"+w).style.width = D.hp[w]+"%"; $("hpn-"+w).textContent = D.hp[w]; });
}

function nextQuestion(){
  if(D.i >= D.pool.length || D.hp.you <= 0 || D.hp.opp <= 0) return finish();
  const q = D.pool[D.i];
  D.q = q;
  D.opts = shuffle(q.options.map((t,i) => ({t, c: i === q.answer})));
  D.locked = false; D.botShown = false; D.next = null;
  D.botCorrect = Math.random() < D.bot.acc;
  const [a,b] = D.bot.speed;
  D.botTime = a + Math.random()*(b-a);

  $("round").textContent = `Question ${D.i+1} of ${D.pool.length}`;
  $("qcat").textContent = q.category || "";
  $("botstate").textContent = "";
  $("qtext").textContent = q.q;
  $("verdict").innerHTML = "";
  $("opts").innerHTML = D.opts.map((o,i) =>
    `<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o.t)}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(btn => btn.onclick = () => answer(+btn.dataset.i));
  setHP();

  D.t0 = performance.now();
  clearInterval(D.timer);
  D.timer = setInterval(tick, 100);
  tick();
}

function elapsed(){ return Math.min(TIME, (performance.now() - D.t0) / 1000); }

function tick(){
  const e = elapsed();
  const bar = $("bar");
  bar.style.width = ((1 - e/TIME) * 100) + "%";
  bar.classList.toggle("low", TIME - e <= 5);
  $("secs").textContent = Math.ceil(TIME - e);
  if(!D.botShown && e >= D.botTime){
    D.botShown = true;
    $("botstate").innerHTML = `<span class="locked">${esc(D.bot.name)} has locked in</span>`;
  }
  if(e >= TIME) answer(-1);
}

function answer(idx){
  if(!D || D.locked) return;
  D.locked = true;
  clearInterval(D.timer);
  const t = elapsed();
  const you = idx >= 0 ? {t, correct: D.opts[idx].c} : null;
  const bot = {t: D.botTime, correct: D.botCorrect};
  D.answered++;
  if(you && you.correct) D.correct++;

  // decide who lands the hit
  let winner = null;
  const youOK = you && you.correct, botOK = bot.correct;
  if(youOK && botOK) winner = you.t <= bot.t ? "you" : "opp";
  else if(youOK) winner = "you";
  else if(botOK) winner = "opp";

  let msg = "Both missed. No damage.";
  if(winner){
    const tw = winner === "you" ? you.t : bot.t;
    const dmg = 15 + Math.round(10 * (1 - tw / TIME));
    const loser = winner === "you" ? "opp" : "you";
    D.hp[loser] = Math.max(0, D.hp[loser] - dmg);
    if(winner === "you") msg = botOK ? `Both right, but you were faster. ${D.bot.name} takes ${dmg}.` : `Correct. ${D.bot.name} takes ${dmg}.`;
    else msg = youOK ? `Both right, but ${D.bot.name} was faster. You take ${dmg}.`
                     : `${you ? "Wrong answer." : "Time's up."} ${D.bot.name} hits you for ${dmg}.`;
    const side = $("side-" + loser); side.classList.remove("hit"); void side.offsetWidth; side.classList.add("hit");
  }

  // reveal
  $("opts").querySelectorAll(".opt").forEach((btn,i) => {
    btn.disabled = true;
    if(D.opts[i].c) btn.classList.add("correct");
    else if(i === idx) btn.classList.add("wrong");
  });
  setHP();
  D.i++;
  const last = D.i >= D.pool.length || D.hp.you <= 0 || D.hp.opp <= 0;
  $("verdict").innerHTML = `<p>${esc(msg)}</p><button class="ghost" id="next">${last ? "See result" : "Next question"}</button>`;
  D.next = () => { clearTimeout(D.auto); D.next = null; nextQuestion(); };
  $("next").onclick = D.next;
  $("next").focus();
}

/* ---------------- Result ---------------- */
function finish(){
  clearTimers();
  const you = D.hp.you, opp = D.hp.opp;
  const result = you > opp ? "win" : you < opp ? "loss" : "draw";
  const delta = applyResult(result, D.bot.name, D.bot.rating, "bot");
  if(isQuizKey(D.cat) && D.answered) recordQuizPlay(D.cat.slice(5), D.correct / D.answered);

  const title = result === "win" ? "Victory" : result === "loss" ? "Defeat" : "Draw";
  const how = opp <= 0 ? "You knocked them out." : you <= 0 ? `${D.bot.name} knocked you out.` : "Decided on health after the last question.";
  const bot = D.bot.id, cat = selCat;
  app.innerHTML = `
  <section class="result">
    <h1>${title}</h1>
    <p class="sub" style="margin-inline:auto">${how}</p>
    <div class="stats">
      <div class="stat"><b>${you} – ${opp}</b><span>Final health</span></div>
      <div class="stat"><b>${D.correct}/${D.answered}</b><span>Correct</span></div>
      <div class="stat"><b>${save.rating} <small class="${result}">(${delta>=0?"+":""}${delta})</small></b><span>Rating</span></div>
    </div>
    ${session.guest ? `<p class="note" style="margin-bottom:16px">This result isn’t saved. <button class="linkbtn" id="savelogin" style="margin-top:0">Create an account</button> to keep your rating.</p>` : ""}
    <div class="actions">
      <button class="primary" id="again">Rematch</button>
      <button class="ghost" id="back">Back to dashboard</button>
    </div>
  </section>`;
  $("again").onclick = () => startDuel(bot, cat);
  if($("savelogin")) $("savelogin").onclick = () => showAuth("signup");
  $("back").onclick = showDash;
  D = null;
}

/* ---------------- Online duels (real players) ---------------- */
let O = null;   // live online duel
let Q = null;   // waiting for an opponent

const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const makeCode = () => Array.from({length:6}, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const hueOf = s => [...s].reduce((a,c) => a + c.charCodeAt(0), 0) * 37 % 360;
const errText = e => e && e.code === "permission-denied"
  ? "The server refused the request. The Firestore rules may be missing the matches section."
  : e && e.code === "resource-exhausted"
  ? "Online features are very busy right now (the daily limit has been reached). Please try again later."
  : "Something went wrong. Check your connection and try again.";

// The one place a duel result changes rating. Used by bot duels and online duels.
function applyResult(result, oppName, oppRating, mode = "online"){
  const score = result === "win" ? 1 : result === "loss" ? 0 : 0.5;
  const expected = 1 / (1 + Math.pow(10, (oppRating - save.rating) / 400));
  const delta = Math.round(32 * (score - expected));
  save.rating = Math.max(100, save.rating + delta);
  save[result === "win" ? "wins" : result === "loss" ? "losses" : "draws"]++;
  save.history = [{bot:oppName, result, delta}].concat(save.history).slice(0, 8);
  logGame({mode, title:`vs ${oppName}`, result, delta});
  persist(); updateChip();
  return delta;
}

function cloudNote(){
  if(cloudFailed) return `Couldn’t connect to the online service (${cloudMsg}). Reload the page, and turn off any ad blocker for this site.`;
  return "Online duels need online accounts, which this copy of the site doesn’t have set up.";
}
function onlineGate(next){
  if(!(CLOUD && fb)){ $("onnote").textContent = cloudNote(); return; }
  if(!session || !session.uid){ showAuth("login"); return; }
  next();
}

function newMatchData(quick, code){
  const n = Math.min(ROUNDS, QUESTIONS.length);
  const qids = shuffle(QUESTIONS.map((_, i) => i)).slice(0, n);
  const perm = qids.map(i => shuffle(QUESTIONS[i].options.map((_, j) => j)).join(""));
  return {status:"waiting", quick, code, createdMs:Date.now(),
    host:{uid:session.uid, name:session.name, rating:save.rating}, guest:null, qids, perm, answers:{}};
}

async function claim(ref){
  const me = {uid:session.uid, name:session.name, rating:save.rating};
  return fb.fs.runTransaction(async tx => {
    const s = await tx.get(ref);
    if(!s.exists) throw new Error("gone");
    const d = s.data();
    if(d.status !== "waiting" || d.guest) throw new Error("taken");
    if(d.host.uid === session.uid) throw new Error("own");
    tx.update(ref, {guest:me, status:"playing"});
    return Object.assign({}, d, {guest:me, status:"playing"});
  });
}

function cancelWaiting(){
  const q = Q; if(!q) return; Q = null;
  if(q.unsub) q.unsub();
  clearInterval(q.timer);
  if(q.ref) q.ref.delete().catch(() => {});
}

function showNotice(title, msg, buttons){
  buttons = buttons || [];
  app.innerHTML = `
  <section class="panel auth">
    <h1>${esc(title)}</h1>
    <p class="sub">${esc(msg)}</p>
    <div class="actions" style="justify-content:flex-start">
      ${buttons.map((b,i) => `<button class="${b.primary ? "primary" : "ghost"}" id="nb${i}">${esc(b.label)}</button>`).join("")}
      <button class="ghost" id="nbk">Back to dashboard</button>
    </div>
  </section>`;
  buttons.forEach((b,i) => $("nb"+i).onclick = b.fn);
  $("nbk").onclick = showDash;
}
function showNoOne(room){
  showNotice(room ? "Your room closed" : "No opponents right now",
    room ? "Nobody joined in time." : "Nobody was around to duel. Try again in a moment, or practise against a bot.",
    room ? [] : [{label:"Try again", primary:true, fn:() => onlineGate(startQuick)}, {label:"Play a bot", fn:startRanked}]);
}

function showWaiting(){
  const q = Q; if(!q) return;
  app.innerHTML = `
  <section class="panel auth">
    <h1>${q.quick ? "Finding an opponent" : q.invite ? "Challenge sent" : "Waiting for your friend"}</h1>
    ${q.invite ? `<p class="sub">Waiting for ${esc(q.inviteName)} to accept. They need to have Quizerion open.</p>`
      : q.quick
      ? `<p class="sub" id="wmsg">Looking for someone near your rating.</p>`
      : `<p class="sub">Send this code to your friend. They can enter it under Challenge a friend.</p><div class="code" aria-label="Room code">${esc(q.code)}</div>`}
    <p class="note" id="wt" role="status"></p>
    <div class="actions" style="justify-content:flex-start;margin-top:14px">
      <button class="ghost" id="wcancel">Cancel</button>
      ${q.quick ? `<button class="ghost" id="wbot" hidden>Play a bot instead</button>` : ""}
    </div>
  </section>`;
  $("wcancel").onclick = () => { cancelWaiting(); showDash(); };
  if($("wbot")) $("wbot").onclick = () => { cancelWaiting(); startRanked(); };
  clearInterval(q.timer);
  q.timer = setInterval(() => {
    if(Q !== q){ clearInterval(q.timer); return; }
    const s = Math.floor((Date.now() - q.t0) / 1000);
    if($("wt")) $("wt").textContent = `Waiting ${s}s`;
    if(q.quick && s === 30 && $("wbot")){ $("wbot").hidden = false; $("wmsg").textContent = "No one has joined yet. Keep waiting or play a bot."; }
    if(q.quick && s >= 60){ cancelWaiting(); showNoOne(false); }
    if(!q.quick && !q.invite && s >= 600){ cancelWaiting(); showNoOne(true); }
    if(q.invite && s >= 120){ cancelWaiting(); showNotice("No answer", `${q.inviteName} didn't respond to your challenge.`); }
  }, 1000);
}

async function hostMatch(q){
  const data = newMatchData(q.quick, q.code);
  if(q.invite){ data.inviteTo = q.inviteTo; data.inviteName = session.name; }
  const ref = fb.fs.collection("matches").doc();
  await ref.set(data);
  if(Q !== q){ ref.delete().catch(() => {}); return; }
  q.ref = ref;
  q.unsub = ref.onSnapshot(s => {
    const d = s.exists ? s.data() : null;
    if(Q === q && d && d.declined){
      Q = null; if(q.unsub) q.unsub(); clearInterval(q.timer); ref.delete().catch(() => {});
      showNotice("Challenge declined", `${q.inviteName} declined your challenge.`);
      return;
    }
    if(Q === q && d && d.status === "playing" && d.guest){
      Q = null;
      if(q.unsub) q.unsub();
      clearInterval(q.timer);
      startOnline(ref, "host", d);
    }
  });
}

async function startQuick(){
  clearTimers(); D = null;
  const q = Q = {quick:true, code:"", ref:null, t0:Date.now(), unsub:null, timer:null};
  showWaiting();
  try{
    const snap = await fb.fs.collection("matches").where("status","==","waiting").where("quick","==",true).limit(20).get();
    const now = Date.now();
    const cands = snap.docs
      .filter(d => { const x = d.data(); return x.host.uid !== session.uid && now - x.createdMs < 90000; })
      .sort((a,b) => Math.abs(a.data().host.rating - save.rating) - Math.abs(b.data().host.rating - save.rating));
    for(const c of cands){
      if(Q !== q) return;
      try{
        const m = await claim(c.ref);
        if(Q !== q) return;
        Q = null; clearInterval(q.timer);
        return startOnline(c.ref, "guest", m);
      }catch(e){ /* someone else got it, try the next */ }
    }
    if(Q !== q) return;
    await hostMatch(q);
  }catch(e){
    console.error(e);
    if(Q === q) cancelWaiting();
    showNotice("Couldn’t start an online duel", errText(e), [{label:"Try again", primary:true, fn:() => onlineGate(startQuick)}]);
  }
}

function showFriend(){

    <button class="primary" id="mk" style="width:100%">Create a room</button>
    <p class="note" style="margin:20px 0 8px">Have a code?</p>
    <form id="jf" novalidate style="display:flex;gap:10px">
      <input id="jc" class="codeinput" maxlength="6" placeholder="ROOM CODE" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code">
      <button class="ghost" type="submit">Join</button>

  $("bk").onclick = showDash;

function startOnline(ref, me, m){
  clearTimers(); D = null;
  const opp = me === "host" ? "guest" : "host";
  const qs = m.qids.map((qi, k) => {
    const q = QUESTIONS[qi], order = m.perm[k].split("").map(Number);
    return {q, opts: order.map(j => ({t:q.options[j], c:j === q.answer}))};
  });
  const o = O = {ref, me, opp, m, qs, k:0, hp:{you:START_HP, opp:START_HP}, oppName:m[opp].name, oppRating:m[opp].rating,
    locked:true, resolved:-1, finished:false, correct:0, answered:0, unsub:null, timer:null, auto:null, fto:null, next:null};
  app.innerHTML = `
  <section class="duel">
    <div class="side opp" id="side-opp">
      <span class="avatar" style="background:hsl(${hueOf(o.oppName)} 52% 38%);color:#fff">${esc(o.oppName[0].toUpperCase())}</span>
      <div class="who"><b>${esc(o.oppName)}</b><span>${o.oppRating}</span></div>
      <div class="hp"><div class="hpfill" id="hp-opp"></div></div><span class="hpn" id="hpn-opp">${START_HP}</span>
    </div>
    <div class="q">
      <div class="qhead"><span id="round"></span><span id="botstate"></span><span id="qcat"></span></div>
      <div class="clockrow"><div class="clock"><div class="clockbar" id="bar"></div></div><span class="secs" id="secs"></span></div>
      <h2 class="qtext" id="qtext"></h2>
      <div class="opts" id="opts"></div>
      <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
    </div>
    <div class="side you" id="side-you">
      <span class="avatar you">${esc((session.name || "Y")[0].toUpperCase())}</span>
      <div class="who"><b>You</b><span>${save.rating}</span></div>
      <div class="hp"><div class="hpfill" id="hp-you"></div></div><span class="hpn" id="hpn-you">${START_HP}</span>
    </div>
  </section>`;
  o.unsub = ref.onSnapshot(s => { if(O === o && s.exists){ o.m = s.data(); onMatchUpdate(); } });
  nextOQuestion();
}

function setOHP(){ ["you","opp"].forEach(w => { $("hp-"+w).style.width = O.hp[w] + "%"; $("hpn-"+w).textContent = O.hp[w]; }); }
const oElapsed = () => Math.min(TIME, (performance.now() - O.t0) / 1000);

function nextOQuestion(){
  const o = O; if(!o) return;
  if(o.k >= o.qs.length || o.hp.you <= 0 || o.hp.opp <= 0) return finishOnline();
  const {q, opts} = o.qs[o.k];
  o.opts = opts; o.locked = false; o.next = null;
  clearTimeout(o.fto); clearTimeout(o.auto);
  $("round").textContent = `Question ${o.k + 1} of ${o.qs.length}`;
  $("qcat").textContent = q.category || "";
  $("botstate").textContent = "";
  $("qtext").textContent = q.q;
  $("verdict").innerHTML = "";
  $("opts").innerHTML = opts.map((x,i) => `<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(x.t)}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(btn => btn.onclick = () => oAnswer(+btn.dataset.i));
  setOHP();
  o.t0 = performance.now();
  clearInterval(o.timer);
  o.timer = setInterval(oTick, 100);
  oTick();
  onMatchUpdate();
}

function oTick(){
  const o = O; if(!o || o.locked) return;
  const e = oElapsed();
  const bar = $("bar");
  bar.style.width = ((1 - e / TIME) * 100) + "%";
  bar.classList.toggle("low", TIME - e <= 5);
  $("secs").textContent = Math.ceil(TIME - e);
  if(e >= TIME) oAnswer(-1);
}

function oAnswer(idx){
  const o = O; if(!o || o.locked || o.finished) return;
  o.locked = true;
  clearInterval(o.timer);
  const t = Math.round(oElapsed() * 100) / 100;
  o.answered++;
  if(idx >= 0 && o.opts[idx].c) o.correct++;
  o.myIdx = idx;
  $("opts").querySelectorAll(".opt").forEach((b,i) => { b.disabled = true; if(i === idx) b.classList.add("picked"); });
  $("verdict").innerHTML = `<p>Answer locked in. Waiting for ${esc(o.oppName)}.</p>`;
  const key = "answers." + o.k + "." + o.me;
  o.ref.update({[key]: {i:idx, t}}).catch(e => console.error(e));
  const k = o.k;
  o.fto = setTimeout(() => { if(O === o && o.resolved < k) finishOnline("forfeit"); }, (Math.max(0, TIME - t) + 10) * 1000);
  onMatchUpdate();
}

function onMatchUpdate(){
  const o = O; if(!o || o.finished) return;
  if(o.m.forfeit && o.m.forfeit === o.opp) return finishOnline("forfeit");
  const a = (o.m.answers || {})[o.k] || {};
  if(!o.locked && a[o.opp]) $("botstate").innerHTML = `<span class="locked">${esc(o.oppName)} has locked in</span>`;
  if(o.locked && a.host && a.guest && o.resolved < o.k) resolveRound(a);
}

function resolveRound(a){
  const o = O, opts = o.qs[o.k].opts;
  o.resolved = o.k;
  clearTimeout(o.fto);
  const ok = r => r.i >= 0 && opts[r.i] && opts[r.i].c;
  const hOK = ok(a.host), gOK = ok(a.guest);
  let w = null;
  let tie = false;
  if(hOK && gOK){ if(a.host.t === a.guest.t) tie = true; else w = a.host.t < a.guest.t ? "host" : "guest"; }
  else if(hOK) w = "host";
  else if(gOK) w = "guest";
  const meOK = o.me === "host" ? hOK : gOK, oppOK = o.me === "host" ? gOK : hOK;
  let msg = tie ? "Both right in exactly the same time. No damage." : "Both missed. No damage.";
  if(w){
    const tw = Math.min(TIME, Math.max(0, a[w].t));
    const dmg = 15 + Math.round(10 * (1 - tw / TIME));
    const loser = w === "host" ? "guest" : "host";
    if(loser === o.me){
      o.hp.you = Math.max(0, o.hp.you - dmg);
      msg = oppOK && meOK ? `Both right, but ${o.oppName} was faster. You take ${dmg}.`
          : `${o.myIdx < 0 ? "Time's up." : "Wrong answer."} ${o.oppName} hits you for ${dmg}.`;
    }else{
      o.hp.opp = Math.max(0, o.hp.opp - dmg);
      msg = oppOK ? `Both right, but you were faster. ${o.oppName} takes ${dmg}.` : `Correct. ${o.oppName} takes ${dmg}.`;
    }
    const side = $("side-" + (loser === o.me ? "you" : "opp")); side.classList.remove("hit"); void side.offsetWidth; side.classList.add("hit");
  }
  $("opts").querySelectorAll(".opt").forEach((btn,i) => {
    btn.disabled = true;
    if(opts[i].c) btn.classList.add("correct");
    else if(i === o.myIdx) btn.classList.add("wrong");
  });
  setOHP();
  const last = o.k + 1 >= o.qs.length || o.hp.you <= 0 || o.hp.opp <= 0;
  $("verdict").innerHTML = `<p>${esc(msg)}</p><button class="ghost" id="next">${last ? "See result" : "Next question"}</button>`;
  o.next = () => { clearTimeout(o.auto); o.next = null; o.k++; nextOQuestion(); };
  $("next").onclick = o.next;
  $("next").focus();
  o.auto = setTimeout(() => { if(O === o && o.next) o.next(); }, 2600);
}

function forfeitOnline(){
  const o = O; if(!o || o.finished) return;
  o.finished = true;
  o.ref.update({forfeit:o.me}).catch(() => {});
  applyResult("loss", o.oppName, o.oppRating);

const soloElapsed = () => Math.min(TIME, (performance.now() - S.t0) / 1000);

function nextSolo(){
  const s = S; if(!s) return;
  if(s.i >= s.n) return finishSolo();
  const q = s.pool[s.i];
  s.opts = shuffle(q.options.map((t,i) => ({t, c:i === q.answer})));
  s.locked = false; s.next = null;
  clearTimeout(s.auto);
  $("round").textContent = `Question ${s.i + 1} of ${s.n}`;
  $("qcat").textContent = q.category || "";
  $("qtext").textContent = q.q;
  $("verdict").innerHTML = "";
  $("s-prog").style.width = (s.i / s.n * 100) + "%";
  $("s-score").textContent = r1(s.score).toFixed(1);
  $("opts").innerHTML = s.opts.map((x,i) => `<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(x.t)}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(btn => btn.onclick = () => soloAnswer(+btn.dataset.i));
  s.t0 = performance.now();
  clearInterval(s.timer);
  s.timer = setInterval(soloTick, 100);
  soloTick();
}

function soloTick(){
  const s = S; if(!s || s.locked) return;
  const e = soloElapsed();
  const bar = $("bar");
  bar.style.width = ((1 - e / TIME) * 100) + "%";
  bar.classList.toggle("low", TIME - e <= 5);
  $("secs").textContent = `${(TIME - e).toFixed(1)} pts`;
  if(e >= TIME) soloAnswer(-1);
}

function soloAnswer(idx){
  const s = S; if(!s || s.locked || s.finished) return;
  s.locked = true;
  clearInterval(s.timer);
  const t = Math.round(soloElapsed() * 100) / 100;
  const correct = idx >= 0 && s.opts[idx].c;
  const pts = correct ? Math.max(0, r1(TIME - t)) : 0;
  if(correct){ s.correct++; s.times.push(t); s.score = r1(s.score + pts); }
  $("opts").querySelectorAll(".opt").forEach((b,i) => {
    b.disabled = true;
    if(s.opts[i].c) b.classList.add("correct");
    else if(i === idx) b.classList.add("wrong");
  });
  $("s-score").textContent = r1(s.score).toFixed(1);
  $("s-prog").style.width = ((s.i + 1) / s.n * 100) + "%";
  const msg = correct ? `Correct in ${t.toFixed(1)}s. +${pts.toFixed(1)} points.`
                      : idx < 0 ? "Time's up. 0 points." : "Wrong answer. 0 points.";
  const last = s.i + 1 >= s.n;
  $("verdict").innerHTML = `<p>${esc(msg)}</p><button class="ghost" id="next">${last ? "See result" : "Next question"}</button>`;
  s.next = () => { clearTimeout(s.auto); s.next = null; s.i++; nextSolo(); };
  $("next").onclick = s.next;
  $("next").focus();
  s.auto = setTimeout(() => { if(S === s && s.next) s.next(); }, 2600);
}
