// Layout in Firestore (built so 50 players never fight over one document):
//   parties/{id}              host-written: phase, cur, settings, questions, reveal counts, leaderboard
//   parties/{id}/players/{u}  each player writes their own entry
//   parties/{id}/answers/{k}_{u}  each player writes only their own answer
// Only the host listens to all answers; it publishes results for everyone else.
let PT = null;
let PARTY_REVEAL_MS = 3000, PARTY_BOARD_MS = 7000;
let partyN = 10, partyCat = "all", partyMode = "ffa";
const PARTY_MODES = [["ffa","Free for all"], ["teams","Teams of 2"], ["duel2v2","2v2 duel"]];
const MODE_HELP = {
  ffa:"Everyone plays for themselves. Up to 50 players.",
  teams:"Players are paired into teams of two at random. A team's score is its players' scores added together. Needs 4 or more players.",
  duel2v2:"Exactly 4 players in two teams of two. Each question, the fastest correct answer hits the other team for 15 to 25 damage, plus 5 if both teammates are right. A team that reaches 0 health loses, otherwise more health after the last question wins."
};
const partyCap = mode => mode === "duel2v2" ? 4 : PARTY_MAX;
const teamLabel = t => `Team ${t + 1}`;
const PARTY_COUNTS = [6, 10, 20, 30], PARTY_MAX = 50;
const activeUids = pl => Object.keys(pl || {}).filter(u => !pl[u].left);
const optOK = (opts, r) => !!(r && r.i >= 0 && opts[r.i] && opts[r.i].c);
const ptsOf = (opts, r) => optOK(opts, r) ? Math.max(0, r1(TIME - Math.min(TIME, Math.max(0, r.t)))) : 0;

function buildQs(m){
  return m.qids.map((qi, k) => {
    const q = (m.cq || QUESTIONS)[qi], order = m.perm[k].split("").map(Number);
    return {q, opts: order.map(j => ({t:q.options[j], c:j === q.answer}))};
  });
}
function partyScores(players, answers, qs, upTo){
  const res = {};
  Object.keys(players).forEach(u => res[u] = {score:0, last:0});
  for(let k = 0; k <= upTo; k++){
    const a = (answers || {})[k] || {};
    Object.keys(res).forEach(u => {
      const pts = ptsOf(qs[k].opts, a[u]);
      res[u].score = r1(res[u].score + pts);
      if(k >= upTo - 1) res[u].last = r1(res[u].last + pts);
    });
  }
  return res;
}
function boardFor(p, upTo){
  const sc = partyScores(p.players, p.answers, p.qs, upTo), board = {};
  Object.keys(sc).forEach(u => {
    board[u] = {name:p.players[u].name, score:sc[u].score, gain:sc[u].last, left:!!p.players[u].left};
    const t = (p.m.teams || {})[u]; if(t !== undefined) board[u].team = t;
  });
  return board;
}
function myTotal(p, upTo){
  let s = 0;
  for(let k = 0; k <= upTo; k++) s = r1(s + ptsOf(p.qs[k].opts, p.my[k]));
  return s;
}

async function createParty(n, cat, mode){
  const src = fieldPool(cat);
  const qids = shuffle(src.map((_, i) => i)).slice(0, Math.min(n, src.length));
  if(!qids.length) throw new Error("none");
  const perm = qids.map(i => shuffle(src[i].options.map((_, j) => j)).join(""));
  const ref = fb.fs.collection("parties").doc();
  const data = {hostUid:session.uid, hostName:session.name, code:makeCode(), phase:"lobby", cur:0, createdMs:Date.now(),
    settings:{n:qids.length, cat:isQuizKey(cat) ? fieldLabel(cat) : cat}, mode:mode || "ffa", qids, perm};
  if(isQuizKey(cat)){   // a community quiz travels inside the party so every player gets the same questions
    data.quizId = cat.slice(5);
    data.cq = src.map(q => ({q:q.q, options:q.options, answer:q.answer, category:q.category}));
  }
  await ref.set(data);
  await ref.collection("players").doc(session.uid).set({name:session.name, joined:Date.now()});
  enterParty(ref, true);
}

async function joinParty(code){
  const snap = await fb.fs.collection("parties").where("code","==",code).where("phase","==","lobby").limit(5).get();
  const now = Date.now();
  const c = snap.docs.find(d => now - d.data().createdMs < 3 * 3600 * 1000);
  if(!c) throw new Error("none");
  const pd = await c.ref.get();
  if(!pd.exists) throw new Error("none");
  if(pd.data().phase !== "lobby") throw new Error("started");
  const ps = await c.ref.collection("players").get();
  const live = ps.docs.filter(d => !d.data().left);
  if(!ps.docs.some(d => d.id === session.uid) && live.length >= partyCap(pd.data().mode)) throw new Error("full");
  const cap = partyCap(pd.data().mode);
  await c.ref.collection("players").doc(session.uid).set({name:session.name, joined:Date.now()});
  // Two people can pass the check above at the same moment. Re-count after joining; whoever joined last backs out.
  const after = (await c.ref.collection("players").get()).docs.filter(d => !d.data().left)
    .sort((x, y) => (x.data().joined - y.data().joined) || (x.id < y.id ? -1 : 1));
  if(after.findIndex(d => d.id === session.uid) >= cap){
    await c.ref.collection("players").doc(session.uid).delete().catch(() => {});
    throw new Error("full");
  }
  enterParty(c.ref, false);
}

function enterParty(ref, isHost){
  clearTimers(); D = null;
  const p = PT = {ref, isHost, me:session.uid, m:null, qs:null, players:{}, answers:{}, my:{},
    unsub:null, unsubP:null, unsubA:null, timer:null, hostT:null, fillT:null,
    viewKey:"", locked:true, finished:false, adv:"", fillKey:"", opts:null};
  p.unsub = ref.onSnapshot(s => {
    if(PT !== p) return;
    if(!s.exists){ partyEnded("The party was closed."); return; }
    p.m = s.data();
    if(!p.qs) p.qs = buildQs(p.m);
    onPartyUpdate();
  });
  p.unsubP = ref.collection("players").onSnapshot(snap => {
    if(PT !== p) return;
    const pl = {};
    snap.docs.forEach(d => pl[d.id] = d.data());
    p.players = pl;
    if(p.m && p.m.phase === "lobby") renderPartyLobby();
    if(p.isHost && p.m) hostDrive();
  });
  if(isHost){
    p.unsubA = ref.collection("answers").onSnapshot(snap => {
      if(PT !== p) return;
      const a = {};
      snap.docs.forEach(d => { const x = d.data(); (a[x.k] = a[x.k] || {})[x.uid] = {i:x.i, t:x.t}; });
      p.answers = a;
      updatePartyProgress();
      if(p.m) hostDrive();
    });
  }
}

function partyLeave(){
  const p = PT; if(!p || p.finished) return;
  p.finished = true;
  if(p.isHost) p.ref.update({phase:"closed"}).catch(() => {});
  else p.ref.collection("players").doc(p.me).update({left:true}).catch(() => {});
}

function onPartyUpdate(){
  const p = PT, m = p.m, ph = m.phase, cur = m.cur || 0;
  if(ph === "closed"){ if(!p.isHost && !p.finished){ p.finished = true; partyEnded("The host ended the party."); } return; }
  if(ph === "lobby") renderPartyLobby();
  else if(ph === "question"){
    if(p.viewKey !== "q" + cur) enterPartyQuestion(cur, false);
    else updatePartyProgress();
  }
  else if(ph === "reveal"){
    if(p.viewKey === "q" + cur) applyPartyReveal(cur);
    else if(p.viewKey !== "r" + cur){ enterPartyQuestion(cur, true); applyPartyReveal(cur); }
  }
  else if(ph === "board" || ph === "done"){
    const key = (ph === "done" ? "d" : "b") + cur;
    if(p.viewKey !== key){ if(ph === "done" && m.mode === "duel2v2") renderTeamDuelResult(cur); else renderPartyBoard(cur, ph === "done"); }
  }
  if(!p.isHost && ph !== "lobby" && p.unsubP){ p.unsubP(); p.unsubP = null; }
  if(p.isHost) hostDrive();
}

function renderPartyLobby(){
  const p = PT, m = p.m; if(!m) return;
  const mode = m.mode || "ffa", cap = partyCap(mode), label = Object.fromEntries(PARTY_MODES)[mode];
  const uids = activeUids(p.players).sort((a,b) => (p.players[a].joined || 0) - (p.players[b].joined || 0));
  if(m.matchmade){   // a 2v2 found by matchmaking: show the teams and start by itself
    if(p.viewKey !== "mm"){
      p.viewKey = "mm";
      app.innerHTML = `
      <section class="panel auth">
        <h1>Match found</h1>
        <p class="sub">Your 2v2 is about to begin.</p>
        <div class="stats" style="grid-template-columns:1fr">
          <div class="stat"><b style="font-size:1.05rem">${esc(teamNames(m, 0))}</b><span>${esc(teamLabel(0))}</span></div>
          <div class="stat"><b style="font-size:1.05rem">${esc(teamNames(m, 1))}</b><span>${esc(teamLabel(1))}</span></div>
        </div>
        <p class="note" role="status">Starting in a moment.</p>
      </section>`;
    }
    if(p.isHost && !p.autoT){
      let tries = 0;
      const go = () => { if(PT !== p || p.m.phase !== "lobby") return; partyStart(); if(++tries < 20) p.autoT = setTimeout(go, 1000); };
      p.autoT = setTimeout(go, MM_AUTO_MS);
    }
    return;
  }
  if(p.viewKey !== "lobby"){
    p.viewKey = "lobby";
    app.innerHTML = `
    <section class="panel boardp">
      <h1>${esc(label)} lobby</h1>
      <p class="sub">${m.settings.n} questions, ${m.settings.cat === "all" ? "all fields" : esc(m.settings.cat)}. ${mode === "duel2v2" ? "Exactly 4 players." : `Up to ${cap} players.`}${mode !== "ffa" ? " Teams are drawn at random when the host starts." : ""}</p>
      <p class="note" style="margin:0">Share this code with your friends</p>
      <div class="code" aria-label="Party code">${esc(m.code)}</div>
      <ol class="lb" id="plist" style="max-height:340px;overflow:auto"></ol>
      <p class="note" id="pwait" style="margin:12px 0"></p>
      <div class="actions" style="justify-content:flex-start">
        ${p.isHost ? `<button class="primary" id="pstart">Start ${mode === "duel2v2" ? "2v2" : "party"}</button>` : ""}
        <button class="ghost" id="pleave">${p.isHost ? "Cancel party" : "Leave"}</button>
      </div>
    </section>`;
    if(p.isHost) $("pstart").onclick = partyStart;
    $("pleave").onclick = () => { if(leaveOk()) showDash(); };
  }
  $("plist").innerHTML = uids.map((u,k) =>
    `<li class="${u === p.me ? "you" : ""}"><span class="rk">${k+1}</span><span>${esc(p.players[u].name)}${u === m.hostUid ? ` <span class="host">host</span>` : ""}</span><span></span></li>`).join("");
  const n = uids.length;
  const canStart = mode === "duel2v2" ? n === 4 : mode === "teams" ? n >= 4 : n >= 1;
  const sb = $("pstart"); if(sb) sb.disabled = !canStart;
  $("pwait").textContent = !p.isHost ? "Waiting for the host to start."
    : mode === "duel2v2" ? (n < 4 ? `Waiting for players (${n} of 4).` : "Four players are ready. Teams are drawn at random when you start.")
    : mode === "teams" ? (n < 4 ? `Teams need at least 4 players (${n} so far).` : `${n} players. Teams are drawn at random when you start.`)
    : (n < 2 ? "Waiting for players to join. You can start whenever you're ready." : `${n} players in the lobby.`);
}

function partyStart(){
  const p = PT; if(!p || !p.isHost || p.m.phase !== "lobby") return;
  const mode = p.m.mode || "ffa", uids = activeUids(p.players);
  const upd = {phase:"question", cur:0};
  if(mode !== "ffa"){
    if(mode === "duel2v2" && uids.length !== 4) return;
    if(mode === "teams" && uids.length < 4) return;
    if(!p.m.teams){   // matchmade games arrive with their teams already drawn
      const order = shuffle(uids), tc = mode === "duel2v2" ? 2 : Math.floor(order.length / 2), teams = {}, info = {};
      order.forEach((u, i) => { const t = Math.min(Math.floor(i / 2), tc - 1); teams[u] = t; (info[t] = info[t] || []).push(p.players[u].name); });
      upd.teams = teams; upd.teamInfo = info;
      if(mode === "duel2v2") upd.hp = {0:START_HP, 1:START_HP};
    }
  }
  p.ref.update(upd).catch(e => console.error(e));
}

const myTeam = p => (p.m.teams && p.m.teams[p.me] !== undefined) ? p.m.teams[p.me] : null;
const teamNames = (m, t) => ((m.teamInfo || {})[t] || []).join(" + ");
function setTeamHP(p){
  const t = myTeam(p), hp = p.m.hp || {};
  if(t === null) return;
  const me = hp[t] != null ? hp[t] : START_HP, opp = hp[1 - t] != null ? hp[1 - t] : START_HP;
  [["you", me], ["opp", opp]].forEach(([w, v]) => { const f = $("hp-" + w), n = $("hpn-" + w); if(f) f.style.width = v + "%"; if(n) n.textContent = v; });
}

function enterPartyQuestion(cur, silent){
  const p = PT, m = p.m, q = p.qs[cur].q, mode = m.mode || "ffa", t = myTeam(p);
  p.viewKey = "q" + cur;
  p.opts = p.qs[cur].opts;

  const hpNow = (m.hp || {});
  const qbox = `
    <div class="q">

      </div>

      <div class="side you" id="side-you">
        <div class="who"><b>Your team</b><span>${esc(teamNames(m, t))}</span></div>
        <div class="hp"><div class="hpfill" id="hp-you" style="width:${me}%"></div></div><span class="hpn" id="hpn-you">${me}</span>
      </div>
    </section>`;
  } else {
    app.innerHTML = `
    <section class="duel">
      <div class="side you">
        <span class="avatar you">${esc(((session.name) || "G")[0].toUpperCase())}</span>
        <div class="who"><b>Your score</b><span>${mode === "teams" && t !== null ? esc(teamLabel(t) + ": " + teamNames(m, t)) : "Party"}</span></div>
        <div class="hp"><div class="hpfill" id="p-prog" style="width:${cur / p.qs.length * 100}%"></div></div>
        <span class="hpn" id="p-score" style="width:76px">${before.toFixed(1)}</span>
      </div>
      ${qbox}
    </section>`;
  }
  $("qtext").textContent = q.q;
  $("opts").innerHTML = p.opts.map((x,i) => `<button class="opt" data-i="${i}"${p.locked ? " disabled" : ""}><kbd>${i+1}</kbd><span>${esc(x.t)}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(btn => btn.onclick = () => partyAnswer(+btn.dataset.i));
  if(!p.locked){
    p.t0 = performance.now();
    p.timer = setInterval(partyTick, 100);
    partyTick();
  } else if(p.my[cur]){
    $("verdict").innerHTML = `<p>Answer locked in. Waiting for the others.</p>`;
  }
  updatePartyProgress();
}

function partyTick(){
  const p = PT; if(!p || p.locked) return;
  const e = Math.min(TIME, (performance.now() - p.t0) / 1000);
  const bar = $("bar");
  bar.style.width = ((1 - e / TIME) * 100) + "%";
  bar.classList.toggle("low", TIME - e <= 5);
  $("secs").textContent = `${(TIME - e).toFixed(1)} pts`;
  if(e >= TIME) partyAnswer(-1);
}

function updatePartyProgress(){
  const p = PT, el = $("p-ans");
  if(!p || !p.isHost || !p.m || !el || p.m.phase !== "question") return;
  const a = p.answers[p.m.cur] || {}, act = activeUids(p.players);
  el.textContent = `${act.filter(u => a[u]).length} of ${act.length} answered`;
}

function partyAnswer(idx){
  const p = PT; if(!p || p.locked || !p.m || p.m.phase !== "question") return;
  p.locked = true;
  clearInterval(p.timer);
  const cur = p.m.cur;
  const t = Math.round(Math.min(TIME, (performance.now() - p.t0) / 1000) * 100) / 100;
  p.my[cur] = {i:idx, t};
  $("opts").querySelectorAll(".opt").forEach((b,i) => { b.disabled = true; if(i === idx) b.classList.add("picked"); });
  $("verdict").innerHTML = `<p>Answer locked in. Waiting for the others.</p>`;
  p.ref.collection("answers").doc(cur + "_" + p.me).set({uid:p.me, k:cur, i:idx, t}).catch(e => console.error(e));
}

function applyPartyReveal(cur){
  const p = PT, m = p.m, opts = p.qs[cur].opts, mode = m.mode || "ffa";
  p.locked = true; clearInterval(p.timer);
  p.viewKey = "r" + cur;
  const mine = p.my[cur];
  const meOK = optOK(opts, mine);
  const t = mine ? Math.min(TIME, Math.max(0, mine.t)) : TIME;
  const pts = ptsOf(opts, mine);
  $("opts").querySelectorAll(".opt").forEach((b,i) => {
    b.disabled = true;
    if(opts[i].c) b.classList.add("correct");
    else if(mine && i === mine.i) b.classList.add("wrong");
  });
  if(mode === "duel2v2" && myTeam(p) !== null){
    const myT = myTeam(p), c = m.clash && m.clash.k === cur ? m.clash : null;
    const own = meOK ? `You answered correctly in ${t.toFixed(1)}s.` : (!mine || mine.i < 0) ? "Time's up." : "Wrong answer.";
    let hit = "Nobody landed a hit.";
    if(c && c.w >= 0){
      hit = c.w === myT ? `${c.who} lands the hit for your team and the opponents take ${c.dmg}.` : `${c.who} hits your team for ${c.dmg}.`;
      if(c.team) hit += " Both teammates were right, so there is a teamwork bonus.";
    }
    $("verdict").innerHTML = `<p>${esc(own + " " + hit)}</p>`;
    setTeamHP(p);
    if(c && c.w >= 0){ const side = $("side-" + (c.w === myT ? "opp" : "you")); if(side){ side.classList.remove("hit"); void side.offsetWidth; side.classList.add("hit"); } }
    return;
  }
  const msg = (meOK ? `Correct in ${t.toFixed(1)}s. +${pts.toFixed(1)} points.`
    : (!mine || mine.i < 0) ? "Time's up. 0 points." : "Wrong answer. 0 points.") + ` ${m.nOK || 0} of ${m.nAct || 0} players got it.`;
  $("verdict").innerHTML = `<p>${esc(msg)}</p>`;
  $("p-score").textContent = myTotal(p, cur).toFixed(1);
  $("p-prog").style.width = ((cur + 1) / p.qs.length * 100) + "%";
}

function renderPartyBoard(cur, final){
  const p = PT, m = p.m, mode = m.mode || "ffa";
  p.viewKey = (final ? "d" : "b") + cur;
  p.locked = true; clearInterval(p.timer);
  if(final) p.finished = true;
  const bd = m.board || {};
  const rows = Object.keys(bd).map(u => ({u, name:bd[u].name, left:!!bd[u].left, score:bd[u].score, gain:bd[u].gain}))
    .sort((a,b) => b.score - a.score || a.name.localeCompare(b.name));
  let teams = [];
  if(mode === "teams"){
    const agg = {};
    Object.keys(bd).forEach(u => {
      const t = bd[u].team; if(t === undefined) return;
      const a = agg[t] = agg[t] || {t, score:0, gain:0, names:[], mine:false};
      a.score = r1(a.score + bd[u].score); a.gain = r1(a.gain + bd[u].gain); a.names.push(bd[u].name); if(u === p.me) a.mine = true;
    });
    teams = Object.values(agg).sort((a,b) => b.score - a.score || a.t - b.t);
  }
  if(final && !p.logged){
    p.logged = true;
    const rank = rows.findIndex(r => r.u === p.me) + 1, myScore = rank ? rows[rank - 1].score : 0;
    if(mode === "teams"){
      const tr = teams.findIndex(x => x.mine) + 1;
      logGame({mode:"party", title:`Team party of ${rows.length}`, place:tr || teams.length, of:teams.length, score:tr ? teams[tr - 1].score : 0});
    } else {
      logGame({mode:"party", title:`Party of ${rows.length}`, place:rank || rows.length, of:rows.length, score:myScore});
    }
    if(m.quizId) recordQuizPlay(m.quizId, myScore / (p.qs.length * TIME));
    persist();
  }
  const teamHtml = teams.length ? `<div class="fhead" style="margin-top:4px">Teams</div>
    <ol class="lb big ${final ? "" : "party"}">${teams.map((x,k) => `<li class="${x.mine ? "you" : ""}"><span class="rk">${k+1}</span><span>${esc(teamLabel(x.t))} <span class="host">${esc(x.names.join(" + "))}</span></span>${final ? "" : `<span class="gain">+${x.gain.toFixed(1)}</span>`}<span class="rt">${x.score.toFixed(1)}</span></li>`).join("")}</ol>
    <div class="fhead">Players</div>` : "";
  app.innerHTML = `
  <section class="panel boardp">
    <h1>${final ? "Final results" : "Leaderboard"}</h1>
    <p class="sub">${final ? `After all ${p.qs.length} questions.` : `After question ${cur + 1} of ${p.qs.length}.`}</p>
    ${teamHtml}
    <ol class="lb big ${final ? "" : "party"}" style="max-height:60vh;overflow:auto">
      ${rows.map((r,k) => `<li class="${r.u === p.me ? "you" : ""}"><span class="rk">${k+1}</span><span>${esc(r.name)}${r.left ? ` <span class="host">left</span>` : ""}</span>${final ? "" : `<span class="gain">+${r.gain.toFixed(1)}</span>`}<span class="rt">${r.score.toFixed(1)}</span></li>`).join("")}
    </ol>
    <div class="actions" style="justify-content:flex-start;margin-top:16px">
      ${final ? `<button class="primary" id="pnew">New party</button><button class="ghost" id="pdash">Dashboard</button>`
        : p.isHost ? `<button class="primary" id="pnext">Continue</button>` : `<p class="note" style="margin:0">The next question starts shortly.</p>`}
    </div>
  </section>`;
  if(final){ $("pnew").onclick = () => onlineGate(showParty); $("pdash").onclick = showDash; }
  else if(p.isHost) $("pnext").onclick = partyNext;
}

// End screen of a 2v2 duel
function renderTeamDuelResult(cur){
  const p = PT, m = p.m, t = myTeam(p) === null ? 0 : myTeam(p), hp = m.hp || {};
  const me = hp[t] != null ? hp[t] : 0, opp = hp[1 - t] != null ? hp[1 - t] : 0;
  p.viewKey = "d" + cur; p.finished = true; p.locked = true; clearInterval(p.timer);
  const result = me > opp ? "win" : me < opp ? "loss" : "draw";
  if(!p.logged){
    p.logged = true;
    logGame({mode:"party", title:"2v2 duel", result});
    if(m.quizId) recordQuizPlay(m.quizId, me / START_HP);
    persist();
  }
  const title = result === "win" ? "Victory" : result === "loss" ? "Defeat" : "Draw";
  const how = opp <= 0 ? "Your team knocked the opponents out." : me <= 0 ? "The opponents knocked your team out." : "Decided on health after the last question.";
  app.innerHTML = `
  <section class="result">
    <h1>${title}</h1>
    <p class="sub" style="margin-inline:auto">${esc(how)}</p>
    <div class="stats">
      <div class="stat"><b>${me} – ${opp}</b><span>Final health</span></div>
      <div class="stat" style="grid-column:span 2"><b style="font-size:1.05rem">${esc(teamNames(m, t))}</b><span>Your team</span></div>
    </div>
    <p class="note">Opponents: ${esc(teamNames(m, 1 - t))}</p>
    <div class="actions" style="margin-top:14px">
      <button class="primary" id="pnew">${m.matchmade ? "Play another 2v2" : "New party"}</button>
      <button class="ghost" id="pdash">Dashboard</button>
    </div>
  </section>`;
  $("pnew").onclick = () => onlineGate(m.matchmade ? show2v2Hub : showParty); $("pdash").onclick = showDash;
}

function partyNext(){
  const p = PT; if(!p || !p.isHost || !p.m || p.m.phase !== "board") return;
  clearTimeout(p.hostT);
  p.ref.update({phase:"question", cur:p.m.cur + 1}).catch(e => console.error(e));
}

// 2v2 duel: the fastest correct answer lands a hit on the other team.
function teamClash(p, cur){
  const m = p.m, a = p.answers[cur] || {}, opts = p.qs[cur].opts, teams = m.teams || {};
  const best = {0:null, 1:null}, okCount = {0:0, 1:0};
  activeUids(p.players).forEach(u => {
    const t = teams[u], r = a[u];
    if(t === undefined || !optOK(opts, r)) return;
    okCount[t]++;
    const tm = Math.min(TIME, Math.max(0, r.t));
    if(!best[t] || tm < best[t].t) best[t] = {t:tm, name:p.players[u].name};
  });
  let w = -1;
  if(best[0] && best[1]) w = best[0].t <= best[1].t ? 0 : 1; else if(best[0]) w = 0; else if(best[1]) w = 1;
  const hp = {0:(m.hp && m.hp[0] != null ? m.hp[0] : START_HP), 1:(m.hp && m.hp[1] != null ? m.hp[1] : START_HP)};
  let dmg = 0, who = "", team = false;
  if(w >= 0){
    team = okCount[w] >= 2;
    dmg = 15 + Math.round(10 * (1 - best[w].t / TIME)) + (team ? 5 : 0);
    who = best[w].name;
    hp[1 - w] = Math.max(0, hp[1 - w] - dmg);
  }
  return {hp, clash:{k:cur, w, dmg, who, team}};
}

// Host only: moves the party along.
function hostDrive(){
  const p = PT; if(!p || !p.isHost || !p.m || !p.qs) return;
  const m = p.m, ph = m.phase, cur = m.cur || 0, key = ph + cur;
  if(ph === "question"){
    const a = p.answers[cur] || {}, act = activeUids(p.players);
    const missing = act.filter(u => !a[u]);
    if(!missing.length){
      if(p.adv !== key){
        p.adv = key; clearTimeout(p.fillT);
        const opts = p.qs[cur].opts;
        const upd = {phase:"reveal", nOK:act.filter(u => optOK(opts, a[u])).length, nAct:act.length};
        if(m.mode === "duel2v2") Object.assign(upd, teamClash(p, cur));
        p.ref.update(upd).catch(e => console.error(e));
      }
      return;
    }
    if(p.fillKey !== key){
      p.fillKey = key; clearTimeout(p.fillT);
      // absent players are given a zero so the party never stalls
      p.fillT = setTimeout(() => {
        if(PT !== p || p.m.phase !== "question" || p.m.cur !== cur) return;
        const aa = p.answers[cur] || {};
        activeUids(p.players).forEach(u => {
          if(!aa[u]) p.ref.collection("answers").doc(cur + "_" + u).set({uid:u, k:cur, i:-1, t:TIME}).catch(e => console.error(e));
        });
      }, (TIME + 8) * 1000);
    }
  } else if(ph === "reveal"){
    if(p.adv !== key){
      p.adv = key;
      p.hostT = setTimeout(() => {
        if(PT !== p) return;
        const last = cur + 1 >= p.qs.length;
        let upd;
        if(m.mode === "duel2v2"){
          const over = m.hp && (m.hp[0] <= 0 || m.hp[1] <= 0);
          upd = (last || over) ? {phase:"done"} : {phase:"question", cur:cur + 1};
        } else {
          upd = last ? {phase:"done", board:boardFor(p, cur)}
            : (cur + 1) % 2 === 0 ? {phase:"board", board:boardFor(p, cur)}
            : {phase:"question", cur:cur + 1};
        }
        p.ref.update(upd).catch(e => console.error(e));
      }, PARTY_REVEAL_MS);
    }
  } else if(ph === "board"){
    if(p.adv !== key){ p.adv = key; p.hostT = setTimeout(() => { if(PT === p) partyNext(); }, PARTY_BOARD_MS); }
  }
}

/* ---------------- Friends ---------------- */
// users/{me}/friends/{friend}   your friend list (written by both sides on accept)
// friendRequests/{from}_{to}    a pending request
// matches (with inviteTo)       a direct 1v1 challenge, reusing the online duel flow
let FW = null, toastT = null;
const friendsOn = () => !!(CLOUD && fb && session && session.uid);
const fcol = n => fb.fs.collection(n);
const friendList = () => fcol("users");

function startFriendWatch(){
  if(!friendsOn() || FW) return;
  const me = session.uid;
  const w = FW = {me, reqIn:{}, reqOut:{}, friends:{}, invites:{}, duoInv:{}, ratings:{}, asked:{}, res:null, ready:{req:false, inv:false}, unsubs:[], onChange:null};
  cloudSave();   // makes sure this account can be found by name search
  const keyed = snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); return o; };
  const onErr = e => console.error("friends", e);
  w.unsubs.push(fcol("friendRequests").where("to","==",me).onSnapshot(snap => {
    if(FW !== w) return;
    const next = keyed(snap);
    if(w.ready.req) Object.keys(next).forEach(id => { if(!w.reqIn[id]) toastRequest(next[id]); });
    w.reqIn = next; w.ready.req = true; friendChanged();
  }, onErr));
  w.unsubs.push(fcol("friendRequests").where("from","==",me).onSnapshot(snap => { if(FW !== w) return; w.reqOut = keyed(snap); friendChanged(); }, onErr));
  w.unsubs.push(friendList().doc(me).collection("friends").onSnapshot(snap => { if(FW !== w) return; w.friends = keyed(snap); friendChanged(); }, onErr));
  w.unsubs.push(fcol("duos").where("inviteTo","==",me).where("phase","==","open").onSnapshot(snap => {
    if(FW !== w) return;
    const next = {};
    snap.docs.forEach(d => { const x = d.data(); if(!x.guestUid && Date.now() - x.createdMs < 300000) next[d.id] = x; });
    Object.keys(next).forEach(id => { if(!w.duoInv[id]) toastDuoInvite(id, next[id]); });
    w.duoInv = next; friendChanged();
  }, onErr));
  w.unsubs.push(fcol("matches").where("inviteTo","==",me).where("status","==","waiting").onSnapshot(snap => {
    if(FW !== w) return;
    const next = {};
    snap.docs.forEach(d => { const x = d.data(); if(!x.declined && Date.now() - x.createdMs < 180000) next[d.id] = x; });
    Object.keys(next).forEach(id => { if(!w.invites[id]) toastInvite(id, next[id]); });
    w.invites = next; w.ready.inv = true; friendChanged();
  }, onErr));
}

/* ---------------- Players online ---------------- */
// Each logged-in player writes a heartbeat into one of 2 small "presence" documents
// (spread out so no single document is hammered) and counts the recent ones.
// Heartbeats and counting stop while the tab is hidden, so idle tabs fade out after ~10 minutes.
// (Slow polling keeps Firestore reads low so the free daily quota lasts longer.)
const PRES_SHARDS = 2, PRES_BEAT_MS = 240000, PRES_WINDOW_MS = 600000, PRES_POLL_MS = 300000;
let PRES = null;
const presShard = uid => [...uid].reduce((a,c) => a + c.charCodeAt(0), 0) % PRES_SHARDS;
const presDoc = i => fb.fs.collection("presence").doc("s" + i);

function showOnline(n){
  const bar = $("onbar"), txt = $("oncount"); if(!bar || !txt) return;
  txt.textContent = n === 1 ? "1 player online now" : `${n} players online now`;
  bar.hidden = false;
}
async function refreshPresence(){
  const pr = PRES; if(!pr || document.hidden) return;
  try{
    const snaps = await Promise.all(Array.from({length:PRES_SHARDS}, (_, i) => presDoc(i).get()));
    if(PRES !== pr) return;
    const cutoff = Date.now() - PRES_WINDOW_MS;
    let n = 0; const stale = {};
    snaps.forEach((s, i) => {
      if(!s.exists) return;
      const o = s.data().online || {};
      Object.keys(o).forEach(u => { if(o[u] > cutoff) n++; else (stale[i] = stale[i] || []).push(u); });
    });
    showOnline(Math.max(1, n));
    // now and then, tidy out players who have gone
    Object.keys(stale).forEach(i => {
      if(Math.random() > 0.2) return;
      const upd = {};
      stale[i].slice(0, 50).forEach(u => upd["online." + u] = firebase.firestore.FieldValue.delete());
      presDoc(i).update(upd).catch(() => {});
    });
  }catch(e){ console.error("presence", e); }
}
function beatPresence(){
  const pr = PRES; if(!pr || document.hidden) return;
  presDoc(presShard(pr.me)).set({online:{[pr.me]:Date.now()}}, {merge:true}).catch(e => console.error("presence", e));
}
function startPresence(){
  if(!friendsOn() || PRES) return;
  const pr = PRES = {me:session.uid, beat:null, poll:null, vis:null};
  beatPresence(); refreshPresence();
  pr.beat = setInterval(beatPresence, PRES_BEAT_MS);
  pr.poll = setInterval(refreshPresence, PRES_POLL_MS);
  pr.vis = () => { if(!document.hidden){ beatPresence(); refreshPresence(); } };
  document.addEventListener("visibilitychange", pr.vis);
}
function stopPresence(){
  const pr = PRES; if(!pr) return; PRES = null;
  clearInterval(pr.beat); clearInterval(pr.poll);
  if(document.removeEventListener) document.removeEventListener("visibilitychange", pr.vis);
  try{ presDoc(presShard(pr.me)).update({["online." + pr.me]: firebase.firestore.FieldValue.delete()}).catch(() => {}); }catch(e){}
  const bar = $("onbar"); if(bar) bar.hidden = true;
}

const ordinal = n => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
function ago(t){
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return "just now";
  if(m < 60) return `${m} min ago`;
  if(m < 60 * 24) return `${Math.round(m / 60)} h ago`;
  if(m < 60 * 24 * 7) return `${Math.round(m / 1440)} d ago`;
  return new Date(t).toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"});
}
function gameRow(g, i){
  const label = {bot:"Bot duel", online:"Online duel", solo:"Singleplayer", party:"Party"}[g.mode] || "Game";
  let out = "", cls = "";
  if(g.mode === "solo" && g.d){ out = `${g.d.score.toFixed(1)} / ${g.d.max}`; }
  else if(g.mode === "party" && g.result){ out = g.result === "win" ? "Won" : g.result === "loss" ? "Lost" : "Drew"; cls = g.result; }
  else if(g.mode === "party"){ out = `${ordinal(g.place)} of ${g.of}`; cls = g.place === 1 ? "win" : ""; }
  else { out = `${g.result === "win" ? "Won" : g.result === "loss" ? "Lost" : "Drew"} ${g.delta >= 0 ? "+" : ""}${g.delta}`; cls = g.result; }
  const share = g.mode === "solo" && g.d ? `<button class="ghost sm" data-sh="${i}">Share</button>` : "";
  return `<div class="frow"><span class="nm"><span class="tag">${label}</span>${esc(g.title || "")}<span class="sub2">${ago(g.t)}</span></span><span class="res ${cls}">${esc(out)}</span>${share}</div>`;
}
function catLabelFor(key){

  return c || key;
}

/* ---------------- Community quizzes ---------------- */
// quizzes/{id}               a released quiz: title, questions, plays, players
// quizzes/{id}/plays/{uid}   one small record per player so the creator can see who played
let CQ = {}, CQ_T = 0, CQ_P = null, qDraft = null;
const QUIZ_MIN = 5, QUIZ_MAX = 30, QUIZ_LIMIT = 10;
const isQuizKey = k => typeof k === "string" && k.startsWith("quiz:");
function fieldPool(key){
  if(key === "all") return QUESTIONS;
  if(isQuizKey(key)){ const z = CQ[key.slice(5)]; return z ? z.qs : []; }
  return QUESTIONS.filter(q => q.category === key);
}
function fieldLabel(key){
  if(key === "all") return "All fields";
  if(isQuizKey(key)){ const z = CQ[key.slice(5)]; return z ? z.title : "Community quiz"; }
  return key;
}
function normQuiz(id, x){
  if(!x || !Array.isArray(x.qs)) return null;
  const qs = x.qs.filter(k => k && k.q && Array.isArray(k.o) && k.o.length === 4 && k.a >= 0 && k.a < 4)
    .map(k => ({q:String(k.q), options:k.o.map(String), answer:k.a, category:String(x.title || "")}));
  if(!qs.length) return null;
  return {id, title:String(x.title || "Untitled"), desc:String(x.desc || ""), creatorUid:x.creatorUid, creatorName:String(x.creatorName || "Player"),
    plays:x.plays || 0, players:x.players || 0, createdMs:x.createdMs || 0, qs};
}
async function loadQuizzes(force){
  if(!(CLOUD && fb)) return CQ;
  if(!force && Date.now() - CQ_T < 300000) return CQ;
  if(CQ_P) return CQ_P;
  CQ_P = (async () => {
    try{
      const snap = await fcol("quizzes").orderBy("plays", "desc").limit(40).get();
      const next = {};
      snap.docs.forEach(d => { const z = normQuiz(d.id, d.data()); if(z) next[d.id] = z; });
      Object.keys(CQ).forEach(id => { if(CQ[id].creatorUid === (session && session.uid) && !next[id]) next[id] = CQ[id]; });
      CQ = next; CQ_T = Date.now();
    }catch(e){ console.error("quizzes", e); }
    CQ_P = null;
    return CQ;
  })();
  return CQ_P;
}
// Fills a field dropdown: the built-in fields first, then the community quizzes after them.
function fillFieldSelect(sel, getCur, allLabel, onChange){
  if(!sel) return;
  const built = [...new Set(QUESTIONS.map(q => q.category))].sort();
  const render = () => {
    const cur = getCur();
    const zs = Object.values(CQ).sort((a,b) => b.plays - a.plays || a.title.localeCompare(b.title));
    sel.innerHTML = `<option value="all">${esc(allLabel)}</option>` + built.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("") +
      (zs.length ? `<optgroup label="Community quizzes">${zs.map(z => `<option value="quiz:${esc(z.id)}">${esc(z.title)} (by ${esc(z.creatorName)})</option>`).join("")}</optgroup>` : "");
    sel.value = cur;
  };
  render();
  loadQuizzes().then(() => { if(sel.isConnected !== false){ render(); if(onChange) onChange(); } });
}

// Counts a play for the creator. The creator's own plays are not counted.
async function recordQuizPlay(id, pct){
  if(!friendsOn()) return;
  const z = CQ[id]; if(!z || z.creatorUid === session.uid) return;
  pct = Math.max(0, Math.min(1, pct || 0));
  try{
    const qref = fcol("quizzes").doc(id), pref = qref.collection("plays").doc(session.uid);
    const snap = await pref.get(), first = !snap.exists, old = first ? {} : snap.data();
    await pref.set({name:session.name, count:(old.count || 0) + 1, sumPct:(old.sumPct || 0) + pct, bestPct:Math.max(old.bestPct || 0, pct), last:Date.now()});
    const inc = k => firebase.firestore.FieldValue.increment(k);
    await qref.update(first ? {plays:inc(1), players:inc(1)} : {plays:inc(1)});
    z.plays = (z.plays || 0) + 1; if(first) z.players = (z.players || 0) + 1;
  }catch(e){ console.error("quiz play", e); }
}

function validateQuiz(d){
  const t = d.title.trim(), ds = d.desc.trim();
  if(t.length < 3 || t.length > 40) return "Give your quiz a title of 3 to 40 characters.";
  if(ds.length > 140) return "Keep the description under 140 characters.";
  if(d.qs.length < QUIZ_MIN) return `Add at least ${QUIZ_MIN} questions.`;
  if(d.qs.length > QUIZ_MAX) return `A quiz can have at most ${QUIZ_MAX} questions.`;
  for(let i = 0; i < d.qs.length; i++){
    const x = d.qs[i], n = i + 1, q = x.q.trim(), o = x.o.map(s => s.trim());
    if(q.length < 5 || q.length > 250) return `Question ${n}: write the question in 5 to 250 characters.`;
    if(o.length !== 4 || o.some(s => !s || s.length > 100)) return `Question ${n}: fill in all four answers (up to 100 characters each).`;
    if(new Set(o.map(s => s.toLowerCase())).size !== 4) return `Question ${n}: the four answers must be different.`;
    if(!(x.a >= 0 && x.a < 4)) return `Question ${n}: choose the correct answer.`;
  }
  return null;
}
async function releaseQuiz(d){
  const bad = validateQuiz(d); if(bad) throw new Error(bad);
  const mine = await fcol("quizzes").where("creatorUid", "==", session.uid).get();
  if(mine.docs.length >= QUIZ_LIMIT) throw new Error("limit");
  const ref = fcol("quizzes").doc();
  await ref.set({title:d.title.trim(), desc:d.desc.trim(), creatorUid:session.uid, creatorName:session.name, createdMs:Date.now(), plays:0, players:0,
    qs:d.qs.map(x => ({q:x.q.trim(), o:x.o.map(s => s.trim()), a:x.a}))});
  CQ_T = 0;
  return ref.id;
}

/* ---------------- 2v2 matchmaking ---------------- */
// queue2v2/{id}  a waiting ticket: one player, or two friends queued together
// duos/{id}      two friends getting ready to queue together
// The player who completes a set of four builds the match and moves everyone in.
let MM = null, DU = null;
let MM_BEAT_MS = 20000, MM_SCAN_MS = 10000, MM_AUTO_MS = 4000;
const MM_STALE_MS = 60000, MM_QUESTIONS = 10;

function pickMatch(mine, others){
  const duos = others.filter(t => t.uids.length === 2), solos = others.filter(t => t.uids.length === 1);
  if(mine.uids.length === 2){
    if(duos.length) return {tickets:[mine, duos[0]], teams:[mine.uids, duos[0].uids]};
    if(solos.length >= 2) return {tickets:[mine, solos[0], solos[1]], teams:[mine.uids, [solos[0].uids[0], solos[1].uids[0]]]};
    return null;
  }
  if(duos.length && solos.length) return {tickets:[mine, duos[0], solos[0]], teams:[duos[0].uids, [mine.uids[0], solos[0].uids[0]]]};
  if(solos.length >= 3){
    const four = shuffle([mine.uids[0], solos[0].uids[0], solos[1].uids[0], solos[2].uids[0]]);
    return {tickets:[mine, solos[0], solos[1], solos[2]], teams:[four.slice(0, 2), four.slice(2)]};
  }
  return null;
}

async function mmScan(mm){
  if(!mm || mm.scanning || MM !== mm) return false;
  mm.scanning = true;
  try{
    // Only tickets seen recently (single-field range, so no extra index). Dead tickets are old, so they never fill the 30.
    const snap = await fcol("queue2v2").where("seen", ">", Date.now() - MM_STALE_MS).limit(30).get();
    if(MM !== mm) return false;
    const now = Date.now();
    const others = snap.docs.map(d => Object.assign({id:d.id}, d.data()))
      .filter(t => t.status === "waiting" && t.id !== mm.id && now - (t.seen || 0) < MM_STALE_MS && Array.isArray(t.uids) && !t.uids.some(u => mm.uids.includes(u)))
      .sort((a,b) => a.createdMs - b.createdMs);
    const pick = pickMatch({id:mm.id, uids:mm.uids, names:mm.names}, others);
    return pick ? await mmAssemble(mm, pick) : false;
  }catch(e){ console.error("matchmaking", e); return false; }
  finally{ mm.scanning = false; }
}

async function mmAssemble(mm, pick){
  const nameOf = {};
  pick.tickets.forEach(t => t.uids.forEach((u, i) => nameOf[u] = (t.names || [])[i] || "Player"));
  const teams = {}, info = {0:[], 1:[]};
  pick.teams.forEach((pair, t) => pair.forEach(u => { teams[u] = t; info[t].push(nameOf[u]); }));
  const qids = shuffle(QUESTIONS.map((_, i) => i)).slice(0, MM_QUESTIONS);
  const perm = qids.map(i => shuffle(QUESTIONS[i].options.map((_, j) => j)).join(""));
  const ref = fcol("parties").doc(), uids = Object.keys(teams);
  const party = {hostUid:session.uid, hostName:session.name, code:"", phase:"lobby", cur:0, createdMs:Date.now(),
    settings:{n:qids.length, cat:"all"}, mode:"duel2v2", matchmade:true, qids, perm, teams, teamInfo:info, hp:{0:START_HP, 1:START_HP}};
  try{   // one atomic step: claim every ticket and create the party, so two people can never build the same match
    await fb.fs.runTransaction(async tx => {
      const refs = pick.tickets.map(t => fcol("queue2v2").doc(t.id)), snaps = [];
      for(const r of refs) snaps.push(await tx.get(r));
      snaps.forEach((sn, i) => { if(i === 0 && !sn.exists) return; if(!sn.exists || sn.data().status !== "waiting") throw new Error("taken"); });
      refs.forEach((r, i) => { if(i === 0 && !snaps[0].exists) return; tx.update(r, {status:"matched", partyId:ref.id}); });
      tx.set(ref, party);
      uids.forEach(u => tx.set(ref.collection("players").doc(u), {name:nameOf[u], joined:Date.now()}));
    });
  }catch(e){
    return false;
  }
  await mmEnter(mm, ref, true);
  return true;
}

async function mmEnter(mm, ref, asHost){
  if(MM !== mm) return;
  MM = null;
  clearInterval(mm.beat); clearInterval(mm.scan); clearInterval(mm.timer);
  if(mm.unsub) mm.unsub();
  if(mm.ticketRef) mm.ticketRef.delete().catch(() => {});
  if(mm.duoRef){
    const d = DU; if(d && d.unsub) d.unsub(); DU = null;
    mm.duoRef.update({phase:"matched", partyId:ref.id}).catch(() => {});
  }
  enterParty(ref, asHost);
}

function cancelSearch(){
  const mm = MM; if(!mm) return null; MM = null;
  clearInterval(mm.beat); clearInterval(mm.scan); clearInterval(mm.timer);
  if(mm.unsub) mm.unsub();
  if(mm.queued && mm.ticketRef) mm.ticketRef.delete().catch(() => {});
  return mm;
}

function showSearching(){
  const mm = MM; if(!mm) return;
  const duo = mm.uids.length === 2;
  app.innerHTML = `
  <section class="panel auth">
    <h1>Finding a 2v2 match</h1>
    <p class="sub">${duo ? `You and ${esc(mm.names[1] === session.name ? mm.names[0] : mm.names[1])} are queued together. You will face another team.` : "You will be teamed up with a random player and face another team."}</p>
    <p class="note" id="wt" role="status">Searching 0s</p>
    <div class="actions" style="justify-content:flex-start;margin-top:14px"><button class="ghost" id="wcancel">Cancel</button></div>
  </section>`;
  $("wcancel").onclick = () => { const was = cancelSearch(); if(was && was.duoRef) was.duoRef.update({phase:"open"}).catch(() => {}); if(was && was.duoRef) showDuoRoom(); else show2v2Hub(); };
  clearInterval(mm.timer);
  mm.timer = setInterval(() => {
    if(MM !== mm){ clearInterval(mm.timer); return; }
    const s = Math.floor((Date.now() - mm.t0) / 1000);
    if($("wt")) $("wt").textContent = s < 60 ? `Searching ${s}s` : `Searching ${s}s. Nobody else is queued yet, so it may take a while.`;
    if(s >= 240){ const was = cancelSearch(); if(was && was.duoRef) was.duoRef.update({phase:"open"}).catch(() => {}); showNotice("No match found", "Not enough players were looking for a 2v2 right now. Try again in a little while, or play a 1v1.", [{label:"Try again", primary:true, fn:show2v2Hub}]); }
  }, 1000);
}

async function startQueue(mm){
  try{
    if(await mmScan(mm)) return;
    if(MM !== mm) return;
    const ref = mm.ticketRef = fcol("queue2v2").doc(mm.id);
    await ref.set({uids:mm.uids, names:mm.names, status:"waiting", partyId:"", createdMs:mm.createdMs, seen:Date.now()});
    if(MM !== mm){ ref.delete().catch(() => {}); return; }
    mm.queued = true;
    mm.unsub = ref.onSnapshot(s => {
      const d = s.exists ? s.data() : null;
      if(MM === mm && d && d.status === "matched" && d.partyId) mmEnter(mm, fcol("parties").doc(d.partyId), false);
    });
    mm.beat = setInterval(() => ref.update({seen:Date.now()}).catch(() => {}), MM_BEAT_MS);
    mm.scan = setInterval(() => mmScan(mm), MM_SCAN_MS);
  }catch(e){
    console.error(e);
    if(MM === mm){ const was = cancelSearch(); if(was && was.duoRef) was.duoRef.update({phase:"open"}).catch(() => {}); }
    showNotice("Couldn’t start the search", errText(e), [{label:"Try again", primary:true, fn:show2v2Hub}]);
  }
}

async function find2v2(){
  if(!friendsOn()) return;
  clearTimers(); D = null;
  const mm = MM = {id:session.uid, uids:[session.uid], names:[session.name], duoRef:null, ticketRef:null, queued:false, createdMs:Date.now(), t0:Date.now(), unsub:null, beat:null, scan:null, timer:null, scanning:false};
  showSearching();
  await startQueue(mm);
}

/* ----- queueing with a friend ----- */
async function createDuo(inviteUid, inviteName){
  clearTimers(); D = null;
  const ref = fcol("duos").doc();
  await ref.set({hostUid:session.uid, hostName:session.name, guestUid:"", guestName:"", inviteTo:inviteUid || "", inviteName:inviteName || "", code:makeCode(), phase:"open", partyId:"", createdMs:Date.now()});
  enterDuo(ref, true);
}
async function joinDuoDoc(ref){
  await fb.fs.runTransaction(async tx => {
    const s = await tx.get(ref);
    if(!s.exists) throw new Error("none");
    const d = s.data();
    if(d.phase !== "open") throw new Error("started");
    if(d.guestUid && d.guestUid !== session.uid) throw new Error("full");
    if(d.hostUid === session.uid) throw new Error("own");
    tx.update(ref, {guestUid:session.uid, guestName:session.name});
  });
  clearTimers(); D = null;
  enterDuo(ref, false);
}
async function joinDuoByCode(code){
  const snap = await fcol("duos").where("code","==",code).where("phase","==","open").limit(5).get();
  const c = snap.docs.find(d => Date.now() - d.data().createdMs < 3600000 && d.data().hostUid !== session.uid);
  if(!c) throw new Error("none");
  await joinDuoDoc(c.ref);
}
function enterDuo(ref, isHost){
  const d = DU = {ref, isHost, m:null, unsub:null};
  d.unsub = ref.onSnapshot(s => {
    if(DU !== d) return;
    if(!s.exists){ duoEnded("The team was closed."); return; }
    d.m = s.data(); onDuoUpdate();
  });
}
function duoEnded(msg){
  const d = DU; DU = null; if(d && d.unsub) d.unsub();
  cancelSearch();
  showNotice("Team ended", msg, [{label:"Back to 2v2", primary:true, fn:show2v2Hub}]);
}
function closeDuo(){
  const d = DU; if(!d) return; DU = null;
  if(d.unsub) d.unsub();
  if(d.isHost) d.ref.update({phase:"closed"}).catch(() => {});
  else d.ref.update({guestUid:"", guestName:""}).catch(() => {});
}
function onDuoUpdate(){
  const d = DU, m = d.m;
  if(m.phase === "closed"){ if(!d.isHost) duoEnded("Your teammate cancelled the team."); return; }
  if(m.phase === "matched" && m.partyId && !d.isHost){
    DU = null; if(d.unsub) d.unsub();
    enterParty(fcol("parties").doc(m.partyId), false);
    return;
  }
  if(d.isHost && m.phase === "queued" && !m.guestUid && MM){   // the teammate left, so stop searching
    cancelSearch(); d.ref.update({phase:"open"}).catch(() => {});
    return;
  }
  if(!MM) showDuoRoom();
}
function startDuoSearch(){
  const d = DU; if(!d || !d.isHost || !d.m || !d.m.guestUid || MM) return;
  const m = d.m;
  d.ref.update({phase:"queued"}).catch(() => {});
  const mm = MM = {id:m.hostUid, uids:[m.hostUid, m.guestUid], names:[m.hostName, m.guestName], duoRef:d.ref, ticketRef:null, queued:false, createdMs:Date.now(), t0:Date.now(), unsub:null, beat:null, scan:null, timer:null, scanning:false};
  showSearching();
  startQueue(mm);
}
function showDuoRoom(){
  const d = DU; if(!d || !d.m || MM) return;
  const m = d.m, partner = d.isHost ? m.guestName : m.hostName;
  const queued = m.phase === "queued";
  app.innerHTML = `
  <section class="panel auth">
    <h1>${d.isHost ? "Your 2v2 team" : "You joined a team"}</h1>
    ${d.isHost && !m.guestUid ? `
      <p class="sub">${m.inviteName ? `Waiting for ${esc(m.inviteName)} to accept your invite.` : "Waiting for your friend to join."} They can also enter this code under Queue with a friend.</p>
      <div class="code" aria-label="Team code">${esc(m.code)}</div>`
    : `<p class="sub">${d.isHost ? `${esc(partner)} is ready.` : `You are teamed with ${esc(partner)}.`}</p>
       <div class="stats" style="grid-template-columns:1fr"><div class="stat"><b style="font-size:1.05rem">${esc(m.hostName)} + ${esc(m.guestName)}</b><span>Your team</span></div></div>
       ${queued ? `<p class="note" role="status">Searching for a match…</p>` : d.isHost ? "" : `<p class="note" role="status">Waiting for ${esc(m.hostName)} to start the search.</p>`}`}
    <div class="actions" style="justify-content:flex-start;margin-top:14px">
      ${d.isHost && m.guestUid && !queued ? `<button class="primary" id="dfind">Find a match</button>` : ""}
      <button class="ghost" id="dleave">${d.isHost ? "Cancel team" : "Leave team"}</button>
    </div>
  </section>`;
  if($("dfind")) $("dfind").onclick = startDuoSearch;
  $("dleave").onclick = () => { closeDuo(); show2v2Hub(); };
}

function toastDuoInvite(id, inv){
  showToast(`${inv.hostName} invited you to team up in a 2v2.`, [
    {label:"Accept", primary:true, fn:() => acceptDuoInvite(id)},
    {label:"Decline", fn:() => hideToast()}], 90000);
}
async function acceptDuoInvite(id){
  if(!leaveOk()) return;
  hideToast();
  try{ await joinDuoDoc(fcol("duos").doc(id)); }
  catch(e){ console.error(e); showNotice("Invite unavailable", "That team invite has expired or was cancelled.", [{label:"Back to 2v2", primary:true, fn:show2v2Hub}]); }
}

function show2v2Hub(){
  if(!friendsOn()) return;
  clearTimers(); D = null; updateChip();
  app.innerHTML = `
  <section class="panel boardp">
    <button class="linkbtn back" id="bk">← Dashboard</button>
    <h1>2v2 duel</h1>
    <p class="sub">Two teams of two. The fastest correct answer lands a hit on the other team, and the team that runs out of health loses.</p>
    <div class="menu">
      <button class="mbtn hero" id="mm-solo"><i class="vs" aria-hidden="true">2v2</i><b>Find a match</b><span>Get a random teammate and face another team</span></button>
      <button class="mbtn" id="mm-duo"><b>Queue with a friend</b><span>Team up with a friend and face two others</span></button>
      <button class="mbtn" id="mm-room"><b>Private 4-player room</b><span>Play with three friends using a code</span></button>
    </div>
  </section>`;
  $("bk").onclick = showDash;
  $("mm-solo").onclick = find2v2;
  $("mm-duo").onclick = showDuoSetup;
  $("mm-room").onclick = () => { partyMode = "duel2v2"; showParty(); };
}

function showDuoSetup(){
  if(!friendsOn()) return;
  clearTimers(); D = null; updateChip(); startFriendWatch();
  app.innerHTML = `
  <section class="panel boardp">
    <button class="linkbtn back" id="bk">← 2v2 duel</button>
    <h1>Queue with a friend</h1>
    <p class="sub">Invite a friend to be your teammate, then search together. You will face either another pair of friends or two random players.</p>
    <div class="fhead" style="margin-top:6px">Invite a friend</div>
    <div id="dfr"></div>
    <div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="ghost" id="dcode">Create a team code instead</button></div>
    <p class="note" style="margin:22px 0 8px">Have a team code?</p>
    <form id="djf" novalidate style="display:flex;gap:10px">
      <input id="djc" class="codeinput" maxlength="6" placeholder="TEAM CODE" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Team code">
      <button class="ghost" type="submit">Join</button>
    </form>
    <div class="err" id="derr" role="alert" style="margin-top:10px"></div>
  </section>`;
  const draw = () => {
    const box = $("dfr"); if(!box || !FW) return;
    const fr = Object.keys(FW.friends).map(u => ({uid:u, name:FW.friends[u].name || "Player"})).sort((a,b) => a.name.localeCompare(b.name));
    box.innerHTML = fr.length ? fr.map(f => `<div class="frow"><span class="nm">${esc(f.name)}</span><button class="primary sm" data-inv="${esc(f.uid)}">Invite</button></div>`).join("")
      : `<p class="note" style="margin:8px 0 0">You have no friends yet. Add some under Friends, or use a team code.</p>`;
    box.querySelectorAll("[data-inv]").forEach(b => b.onclick = async () => {
      const f = fr.find(x => x.uid === b.dataset.inv); b.disabled = true;
      try{ await createDuo(f.uid, f.name); }catch(e){ console.error(e); $("derr").textContent = errText(e); b.disabled = false; }
    });
  };
  FW.onChange = draw; draw();
  $("bk").onclick = show2v2Hub;
  $("dcode").onclick = async () => { try{ await createDuo("", ""); }catch(e){ console.error(e); $("derr").textContent = errText(e); } };
  $("djf").onsubmit = async e => {
    e.preventDefault();
    const err = $("derr"); err.textContent = "";
    const code = $("djc").value.trim().toUpperCase();
    if(code.length !== 6){ err.textContent = "Enter the 6-character code."; return; }
    try{ await joinDuoByCode(code); }
    catch(ex){
      console.error(ex);
      err.textContent = ex.message === "none" ? "No open team with that code. Check it and try again."
        : ex.message === "full" || ex.message === "started" ? "That team already has two players."
        : errText(ex);
    }
  };
}

/* ---------------- Input ---------------- */
document.addEventListener("keydown", e => {
  if(!/^[1-4]$/.test(e.key)) return;
  const i = +e.key - 1;
  if(O && !O.finished){ if(!O.locked && O.opts && i < O.opts.length) oAnswer(i); return; }
  if(PT && !PT.finished){ if(!PT.locked && PT.opts && PT.m && PT.m.phase === "question" && i < PT.opts.length) partyAnswer(i); return; }
  if(S && !S.finished){ if(!S.locked && S.opts && i < S.opts.length) soloAnswer(i); return; }
  if(D && !D.locked && i < D.opts.length) answer(i);
});
$("home").onclick = () => { if(leaveOk()){ if(session) showDash(); else showHome(); } };

(async function boot(){
  if(CLOUD){
    app.innerHTML = '<p class="sub" style="color:#fff">Loading…</p>';
    try{
      await initCloud();
      const u = await new Promise(res => { const un = fb.auth.onAuthStateChanged(x => { un(); res(x); }); });
      if(u){
        const rec = await cloudLoad(u.uid);
        session = {name: rec ? rec.name : ((u.email || "Player").split("@")[0]), uid:u.uid};
        save = rec ? rec.save : defaults();
      }
    }catch(e){ console.error(e); CLOUD = false; cloudFailed = true; fb = null; cloudMsg = (e && (e.code || e.message)) || String(e); }
  }
  if(!CLOUD){
    try{
      const key = lsGet(SES_KEY), acc = key && getAccounts()[key];
      if(acc){ session = {name:acc.name, key}; save = loadProgress(key); }
    }catch(e){}
  }
  if(session) showDash(); else showHome();
})();
</script>
